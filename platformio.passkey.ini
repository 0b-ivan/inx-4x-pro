[platformio]
extra_configs = platformio.ini

[env:x4pro_passkey]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
; Keep the USB mode defines local to this env so ESP-IDF component builds see
; only the passkey values, not both 1 and 0 under -Werror.
build_flags =
  ${base_common.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_RENDER_TASK_STACK=16384
  -DENABLE_SERIAL_LOG
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_FRONTLIGHT_LS
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCROSSPOINT_USB_PASSKEY=1
  ; Stable releases carry both normal and passkey assets under one SemVer tag.
  ; Keeping the same version lets both variants use GitHub /releases/latest
  ; without a second release channel shadowing normal OTA updates.
  -DCROSSPOINT_VERSION=\"${crossplay.version}\"
  -DLOG_LEVEL=2
custom_sdkconfig =
  ${base.custom_sdkconfig}
  CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_HID_ENABLED=y
