[platformio]
extra_configs = platformio.ini

[env:x4pro_passkey]
extends = x4pro_common
build_unflags =
  ${base.build_unflags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${x4pro_common.build_flags}
  -UARDUINO_USB_MODE
  -UARDUINO_USB_CDC_ON_BOOT
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCROSSPOINT_USB_PASSKEY=1
  ; Stable releases carry both normal and passkey assets under one SemVer tag.
  ; Keeping the same version lets both variants use GitHub /releases/latest
  ; without a second release channel shadowing normal OTA updates.
  -DCROSSPOINT_VERSION=\"${crossplay.version}\"
  -DLOG_LEVEL=2
custom_sdkconfig =
  ${base.custom_sdkconfig}
  CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_HID_ENABLED=y
