<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Battleship · CrossPlay</title>
    <style>
      :root { color-scheme: light dark; --bg:#f4f1e8; --ink:#111; --panel:#fffdf7; --muted:#6b6b66; --line:#111; --ship:#111; }
      @media (prefers-color-scheme:dark) { :root { --bg:#171714; --ink:#f4f1e8; --panel:#23231f; --muted:#aaa79d; --line:#f4f1e8; --ship:#c9c7be; } }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; display:grid; place-items:start center; padding:24px; }
      main { width:min(100%,680px); background:var(--panel); border:3px solid var(--line); padding:22px; box-shadow:8px 8px 0 var(--line); }
      header { border-bottom:3px solid var(--line); padding-bottom:14px; margin-bottom:18px; }
      h1 { margin:0; font-size:clamp(28px,8vw,46px); letter-spacing:.04em; }
      h2 { font-size:18px; margin:14px 0 8px; }
      .eyebrow { margin:0 0 8px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
      .status { display:flex; gap:12px; align-items:center; font-weight:700; font-size:18px; }
      .dot { width:14px; height:14px; border-radius:50%; background:var(--ink); flex:0 0 auto; }
      .copy { margin-top:12px; color:var(--muted); line-height:1.5; }
      fieldset { margin:18px 0; border:1px solid var(--line); }
      label { display:inline-block; margin:6px 4px; }
      select,button { font:inherit; padding:8px; }
      button { cursor:pointer; background:var(--panel); color:var(--ink); border:1px solid var(--line); }
      button:disabled { cursor:default; opacity:.45; }
      .player-card { display:grid; grid-template-columns:92px 1fr; gap:14px; align-items:center; margin:8px 0 12px; }
      .avatar { position:relative; width:92px; aspect-ratio:1; border:2px solid var(--line); background:#111; overflow:hidden; }
      .avatar svg { position:absolute; inset:0; width:100%; height:100%; filter:brightness(0) invert(1); }
      .player-name { font-size:18px; font-weight:700; line-height:1.2; }
      .player-slots { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
      .player-slots label { margin:0; font-size:11px; color:var(--muted); }
      .player-slots select { width:100%; margin-top:4px; }
      .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
      .actions button { min-height:44px; font-weight:700; }
      .hint { color:var(--muted); line-height:1.4; font-size:13px; }
      .board { display:grid; grid-template-columns:20px 1fr; grid-template-rows:20px 1fr; gap:4px; margin:6px 0; }
      .col-labels { grid-column:2; display:grid; grid-template-columns:repeat(10,1fr); color:var(--muted); font-size:10px; text-align:center; align-items:end; }
      .row-labels { grid-row:2; display:grid; grid-template-rows:repeat(10,1fr); color:var(--muted); font-size:10px; text-align:right; align-items:center; padding-right:2px; }
      .grid { grid-column:2; grid-row:2; display:grid; grid-template-columns:repeat(10,1fr); position:relative; }
      .grid button { padding:0; aspect-ratio:1; border:1px solid var(--muted); min-width:0; position:relative; }
      .grid button:disabled { opacity:1; cursor:default; }
      .grid .ship { background:var(--ship); }
      .grid .hit::before,.grid .hit::after,.grid .miss::before,.grid .miss::after { content:''; position:absolute; left:12%; right:12%; top:48%; height:2px; background:currentColor; transform:rotate(45deg); transform-origin:center; }
      .grid .hit::after,.grid .miss::after { transform:rotate(-45deg); }
      .grid .hit { background:var(--ship); color:var(--panel); }
      .grid .miss { color:var(--ink); }
      .grid .selected { outline:3px solid var(--ink); outline-offset:-4px; }
      .grid .selected-target { outline:4px double var(--ink); outline-offset:-5px; }
      #battle[hidden],#rematch[hidden],#hud[hidden],#setupState[hidden],#profile[hidden],#placement[hidden],#surrender[hidden] { display:none; }
      #rematch,#surrender { width:100%; margin-top:10px; border:2px solid var(--line); font-weight:700; min-height:44px; }
      #surrender { border-style:dashed; }
      .match-header { border:2px solid var(--line); padding:10px; margin:10px 0 8px; overflow:hidden; }
      .turn-banner { margin:-10px -10px 10px; padding:8px 10px; border-bottom:2px solid var(--line); text-align:center; font-weight:900; font-size:clamp(17px,4vw,24px); letter-spacing:.05em; }
      .battle-info { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; align-items:stretch; }
      .side-panel,.mini-map { min-width:0; border:1px solid var(--line); padding:8px; min-height:142px; transition:none; }
      .side-panel.active { background:var(--ink); color:var(--panel); border-color:var(--ink); outline:2px solid var(--ink); }
      .side-panel.active .side-label { color:var(--panel); }
      .side-label { display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.1em; }
      .side-name { min-height:34px; font-size:clamp(13px,3.2vw,19px); font-weight:900; line-height:1.1; overflow-wrap:anywhere; }
      .fleet-visual { display:grid; gap:5px; margin-top:8px; }
      .fleet-row { display:flex; align-items:center; gap:3px; min-height:15px; width:max-content; max-width:100%; }
      .fleet-row.sunk { opacity:.55; }
      .ship-segment { display:block; position:relative; width:clamp(11px,2.6vw,16px); height:clamp(11px,2.6vw,16px); border:2px solid currentColor; flex:0 0 auto; }
      .ship-segment.hit::before,.ship-segment.hit::after { content:''; position:absolute; left:0; right:0; top:45%; height:2px; background:currentColor; transform:rotate(45deg); transform-origin:center; }
      .ship-segment.hit::after { transform:rotate(-45deg); }
      .mini-map { display:flex; flex-direction:column; }
      .mini-map .side-label { margin-bottom:8px; }
      .mini-grid { grid-column:auto; grid-row:auto; width:100%; max-width:132px; margin:auto; border:1px solid var(--line); }
      .mini-grid button { border-width:0 1px 1px 0; }
      .board-shell { position:relative; }
      .result-banner { display:none; position:absolute; z-index:3; left:8%; right:8%; top:42%; padding:16px 8px; border:4px solid var(--line); background:var(--panel); color:var(--ink); text-align:center; font-weight:900; font-size:clamp(26px,9vw,46px); box-shadow:6px 6px 0 var(--line); }
      .result-banner.show { display:block; }
      @keyframes impact-shake { 0%,100%{transform:translate(0,0)} 15%{transform:translate(-5px,2px)} 30%{transform:translate(5px,-2px)} 45%{transform:translate(-4px,-1px)} 60%{transform:translate(4px,2px)} 75%{transform:translate(-2px,0)} }
      @keyframes ship-flash { 0%,100%{opacity:1} 30%{opacity:.08} 55%{opacity:1} 75%{opacity:.12} }
      main.impact { animation:impact-shake .34s steps(2,end); }
      .fleet-row.flash { animation:ship-flash .7s steps(2,end); }
      main.in-battle { padding:12px; }
      main.in-battle header { display:none; }
      main.in-battle .status { font-size:14px; gap:7px; margin-bottom:5px; }
      main.in-battle .dot { width:9px; height:9px; }
      main.in-battle #feedback { font-size:13px; margin:8px 0 0; color:var(--muted); }
      code { color:var(--ink); font-weight:700; }
      @media (max-width:600px) {
        body { padding:8px; }
        main { padding:14px; box-shadow:4px 4px 0 var(--line); }
        .player-card { grid-template-columns:78px 1fr; gap:10px; }
        .avatar { width:78px; }
        .match-header { padding:7px; }
        .turn-banner { margin:-7px -7px 7px; padding:7px 5px; }
        .battle-info { gap:5px; }
        .side-panel,.mini-map { padding:6px; min-height:124px; }
        .side-label { font-size:9px; }
        .side-name { min-height:30px; font-size:12px; }
        .fleet-visual { gap:4px; margin-top:6px; }
        .fleet-row { gap:2px; min-height:13px; }
        .ship-segment { width:12px; height:12px; border-width:1.5px; }
        .mini-grid { max-width:104px; }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <header><p class="eyebrow">CrossPlay · X4 Pro</p><h1>BATTLESHIP</h1></header>
      <div class="status"><span class="dot"></span><span id="status">Connecting…</span></div>
      <p id="setupState" class="copy">Device status: <code id="phase">offline</code><br /><span id="turn"></span></p>

      <fieldset id="profile" disabled>
        <legend>YOUR PLAYER</legend>
        <div class="player-card">
          <div id="avatar" class="avatar" aria-label="Player avatar"></div>
          <div>
            <div id="playerName" class="player-name">BALD GRIM GRIN</div>
            <div class="player-slots">
              <label>Hair<select id="hair"></select></label>
              <label>Eyes<select id="eyes"></select></label>
              <label>Mouth<select id="mouth"></select></label>
            </div>
          </div>
        </div>
        <button id="save" type="button">USE PLAYER</button>
      </fieldset>

      <fieldset id="placement" hidden disabled>
        <legend>PLACE YOUR FLEET</legend>
        <label>Ship <select id="ship"><option value="0">Carrier · 5</option><option value="1">Battleship · 4</option><option value="2">Cruiser · 3</option><option value="3">Submarine · 3</option><option value="4">Destroyer · 2</option></select></label>
        <p class="hint">Tap a ship to select it, then tap a cell to move it. Double tap a placed ship to rotate it.</p>
        <div id="placeBoard" class="board"><div class="col-labels"></div><div class="row-labels"></div><div id="grid" class="grid" aria-label="Your fleet"></div></div>
        <div class="actions"><button id="randomize" type="button">RANDOMIZE</button><button id="ready" type="button" disabled>CONFIRM FLEET</button></div>
      </fieldset>

      <section id="hud" class="match-header" hidden>
        <div id="hudTurn" class="turn-banner"></div>
        <div class="battle-info">
          <div id="youPanel" class="side-panel">
            <span class="side-label">YOU</span>
            <div id="hudName" class="side-name"></div>
            <div id="ownSummary" class="fleet-visual" aria-label="Your fleet damage"></div>
          </div>
          <div id="enemyPanel" class="side-panel">
            <span class="side-label">OPPONENT</span>
            <div id="enemyName" class="side-name">X4 PRO</div>
            <div id="enemySummary" class="fleet-visual" aria-label="Opponent fleet damage"></div>
          </div>
          <div class="mini-map">
            <span class="side-label">YOUR SEA</span>
            <div id="own" class="grid mini-grid" aria-label="Your fleet minimap"></div>
          </div>
        </div>
      </section>

      <section id="battle" hidden>
        <h2>ENEMY WATERS</h2>
        <div class="board-shell">
          <div id="resultBanner" class="result-banner"></div>
          <div class="board"><div class="col-labels"></div><div class="row-labels"></div><div id="target" class="grid" aria-label="Enemy waters"></div></div>
        </div>
      </section>
      <button id="surrender" type="button" hidden disabled>SURRENDER</button>
      <button id="rematch" type="button" hidden disabled>PLAY AGAIN</button>
      <p id="feedback" role="status">Waiting for connection.</p>
    </main>

    <script>
      /*__BATTLESHIP_AVATAR_SVGS__*/
      const byId=id=>document.getElementById(id);
      const shell=byId('app'),status=byId('status'),phase=byId('phase'),turn=byId('turn'),profile=byId('profile'),placement=byId('placement'),feedback=byId('feedback'),battle=byId('battle'),rematch=byId('rematch'),surrender=byId('surrender'),hud=byId('hud'),setupState=byId('setupState'),youPanel=byId('youPanel'),enemyPanel=byId('enemyPanel');
      const slots=['hair','eyes','mouth'].map(byId), storageKey='crossplay-battleship-resume-v1';
      const words=[['BALD','TUFTY','SLICK','WAVY','CURLY','SPIKY','PUNK','MOP','BUN','BRAIDS','PONY','BOB','LONG','AFRO'],['GRIM','SAD','SLY','SQUINT','SLEEPY','BLINK','GLAD','WINK','BEADY','WIDE','CROSS','BUSHY','SPECS','SHADES'],['GRIN','TEETH','SMIRK','GLUM','POUT','FROWN','GASP','TONGUE','FANGS','SCRUFF','TASH','GOATEE','MUTTON','BEARD']];
      for(let si=0;si<slots.length;si++)for(let i=0;i<14;i++){const o=document.createElement('option');o.value=i;o.textContent=words[si][i];slots[si].appendChild(o);}
      const lengths=[5,4,3,3,2], shipNames=['Carrier','Battleship','Cruiser','Submarine','Destroyer'], cells=[], targets=[], own=[];
      const label=cell=>`${String.fromCharCode(65+Math.floor(cell/10))}${cell%10+1}`;
      document.querySelectorAll('.col-labels').forEach(row=>{for(let n=1;n<=10;n++){const s=document.createElement('span');s.textContent=n;row.appendChild(s);}});
      document.querySelectorAll('.row-labels').forEach(col=>{for(let n=0;n<10;n++){const s=document.createElement('span');s.textContent=String.fromCharCode(65+n);col.appendChild(s);}});
      for(let cell=0;cell<100;cell++){
        const p=document.createElement('button');p.type='button';p.setAttribute('aria-label',label(cell));p.onclick=()=>placeTap(cell);byId('grid').appendChild(p);cells.push(p);
        const t=document.createElement('button');t.type='button';t.setAttribute('aria-label',label(cell));t.onclick=()=>targetTap(cell);byId('target').appendChild(t);targets.push(t);
        const o=document.createElement('button');o.type='button';o.disabled=true;o.setAttribute('aria-label',label(cell));byId('own').appendChild(o);own.push(o);
      }
      let selectedShip=0,lastShipTap=-1,lastShipTapAt=0,selectedTarget=-1,surrenderArmed=false,enemyHits=[0,0,0,0,0],haveFleetStatus=false;
      function playerParts(){return slots.map((s,i)=>words[i][Number(s.value)]);}
      function renderAvatar(){const p=playerParts();byId('playerName').textContent=p.join(' ');byId('hudName').textContent=p.join(' ');byId('avatar').innerHTML=avatarSvg.base+(avatarSvg.hair[p[0]]||'')+(avatarSvg.eyes[p[1]]||'')+(avatarSvg.mouth[p[2]]||'');}
      slots.forEach(s=>s.onchange=renderAvatar);renderAvatar();
      function shipIndexAt(cell){if(!view)return-1;for(let index=0;index<5;index++){const s=view.ships[index];if(s[0]===255)continue;for(let j=0;j<lengths[index];j++)if(s[0]+j*(s[1]?1:10)===cell)return index;}return-1;}
      function placeTap(cell){if(!view||view.ready||pending)return;const hit=shipIndexAt(cell),now=Date.now();if(hit>=0){selectedShip=hit;byId('ship').value=String(hit);if(lastShipTap===hit&&now-lastShipTapAt<380){const s=view.ships[hit];lastShipTap=-1;lastShipTapAt=0;send('place',hit,s[0],s[1]?0:1);return;}lastShipTap=hit;lastShipTapAt=now;renderBoards();return;}lastShipTap=-1;const s=view.ships[selectedShip];send('place',selectedShip,cell,s&&s[0]!==255?s[1]:1);}
      byId('ship').onchange=()=>{selectedShip=Number(byId('ship').value);renderBoards();};
      function loadResume(){try{const v=JSON.parse(sessionStorage.getItem(storageKey)||'null');return v&&/^[a-f0-9]{32}$/.test(v.token)&&validView(v.view)?v:null;}catch{return null;}}
      let saved=loadResume(),socket,retry,token='',resumeToken=saved?saved.token:'',revision=saved?saved.view.revision:0,pending=false,view=saved?saved.view:null,state=null,generation=0,hidden=false,resuming=false;
      function saveResume(){try{if(resumeToken&&view&&view.ready)sessionStorage.setItem(storageKey,JSON.stringify({token:resumeToken,view}));else sessionStorage.removeItem(storageKey);}catch{}}
      function controls(){
        const online=socket&&socket.readyState===WebSocket.OPEN&&token&&!pending;
        const hasProfile=Boolean(view&&view.profile);
        const inBattle=Boolean(view&&view.ready&&state&&(state.phase==='playing'||state.phase==='finished'));
        profile.hidden=hasProfile||inBattle;
        placement.hidden=!hasProfile||Boolean(view&&view.ready)||inBattle;
        profile.disabled=!online||hasProfile||Boolean(state&&state.phase==='finished');
        placement.disabled=!online||!hasProfile||Boolean(view&&view.ready);
        byId('ready').disabled=placement.disabled||!view||view.ships.some(s=>s[0]===255);
        byId('randomize').disabled=placement.disabled;
        setupState.hidden=inBattle;hud.hidden=!inBattle;
        const impacting=shell.className.split(/\s+/).includes('impact');shell.className=((inBattle?'in-battle ':'')+(impacting?'impact':'')).trim();
        const canFire=online&&state&&state.phase==='playing'&&state.myTurn;
        targets.forEach((b,i)=>b.disabled=!canFire||targetState(i)!==0);
        surrender.hidden=!(state&&state.phase==='playing');surrender.disabled=!online||surrender.hidden;
        surrender.textContent=surrenderArmed?'CONFIRM SURRENDER':'SURRENDER';
        rematch.hidden=!(state&&state.phase==='finished');rematch.disabled=!online||rematch.hidden;
      }
      function send(kind,...values){if(!socket||socket.readyState!==WebSocket.OPEN||!token||pending)return;pending=true;controls();socket.send(JSON.stringify([kind,token,revision,...values]));}
      function targetTap(cell){if(!state||!state.myTurn||targetState(cell)!==0||pending)return;surrenderArmed=false;if(selectedTarget===cell){selectedTarget=-1;send('fire',cell);feedback.textContent=`Firing at ${label(cell)}…`;return;}selectedTarget=cell;feedback.textContent=`Target ${label(cell)} selected. Tap again to fire.`;renderBoards();}
      byId('save').onclick=()=>send('profile',...slots.map(s=>Number(s.value)));
      byId('randomize').onclick=()=>{send('randomize');feedback.textContent='Randomizing fleet…';};
      byId('ready').onclick=()=>send('ready');
      surrender.onclick=()=>{if(!state||state.phase!=='playing'||pending)return;if(!surrenderArmed){surrenderArmed=true;selectedTarget=-1;feedback.textContent='Tap CONFIRM SURRENDER to give up this round.';controls();renderBoards();return;}surrenderArmed=false;send('surrender');feedback.textContent='Surrendering…';};
      rematch.onclick=()=>{if(!state||state.phase!=='finished')return;selectedTarget=-1;surrenderArmed=false;enemyHits=[0,0,0,0,0];haveFleetStatus=false;send('rematch');feedback.textContent='Starting a new round…';};
      function validView(d){return d&&Number.isInteger(d.revision)&&d.revision>=0&&d.revision<=4294967295&&typeof d.profile==='boolean'&&typeof d.ready==='boolean'&&typeof d.accepted==='boolean'&&Array.isArray(d.slots)&&d.slots.length===3&&d.slots.every(n=>Number.isInteger(n)&&n>=0&&n<=13)&&Array.isArray(d.ships)&&d.ships.length===5&&d.ships.every(s=>Array.isArray(s)&&s.length===2&&Number.isInteger(s[0])&&(s[0]===255||s[0]>=0&&s[0]<100)&&(s[1]===0||s[1]===1));}
      function decode64(text,size){if(typeof text!=='string')return null;const alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';const out=new Uint8Array(size);let acc=0,bits=0,at=0;for(const ch of text){const v=alpha.indexOf(ch);if(v<0)return null;acc=(acc<<6)|v;bits+=6;if(bits>=8){bits-=8;if(at<size)out[at++]=(acc>>bits)&255;}}return at===size?out:null;}
      function targetStateFrom(board,cell){if(!board)return 0;const bit=cell*2,byte=board[Math.floor(bit/8)];return(byte>>(bit%8))&3;}
      function targetState(cell){return state?targetStateFrom(state.board,cell):0;}
      function shot(mask,cell){return mask&&((mask[Math.floor(cell/8)]>>(cell%8))&1)!==0;}
      function shipAt(cell){return shipIndexAt(cell)>=0;}
      function ownPattern(index,incoming){if(!view||view.ships[index][0]===255)return Array(lengths[index]).fill(false);const s=view.ships[index];return Array.from({length:lengths[index]},(_,j)=>Boolean(incoming&&shot(incoming,s[0]+j*(s[1]?1:10))));}
      function enemyPattern(index){const hits=Math.min(lengths[index],Math.max(0,enemyHits[index]||0));return Array.from({length:lengths[index]},(_,j)=>j<hits);}
      function fleetRow(name,pattern){const row=document.createElement('div'),hits=pattern.filter(Boolean).length;row.className='fleet-row'+(hits===pattern.length?' sunk':'');row.setAttribute('aria-label',`${name}: ${hits} of ${pattern.length} hit`);pattern.forEach(hit=>{const segment=document.createElement('span');segment.className='ship-segment'+(hit?' hit':'');row.appendChild(segment);});return row;}
      function renderSummary(){const ownBox=byId('ownSummary'),enemyBox=byId('enemySummary');ownBox.innerHTML='';enemyBox.innerHTML='';for(let i=0;i<5;i++){const ownHits=ownPattern(i,state&&state.incoming);ownBox.appendChild(fleetRow(shipNames[i],ownHits));let pattern=enemyPattern(i);if(state&&(state.sunkMask&(1<<i)))pattern=Array(lengths[i]).fill(true);enemyBox.appendChild(fleetRow(shipNames[i],pattern));}}
      function transientClass(element,name,ms){if(!element)return;const names=element.className.split(/\s+/).filter(Boolean).filter(v=>v!==name);element.className=[...names,name].join(' ');setTimeout(()=>{element.className=element.className.split(/\s+/).filter(Boolean).filter(v=>v!==name).join(' ');},ms);}
      function impact(side,index){transientClass(shell,'impact',380);const box=side==='you'?byId('ownSummary'):byId('enemySummary');if(index>=0&&box.children[index])transientClass(box.children[index],'flash',760);}
      function newlyHitOwnShip(previous,next){if(!previous||!next||!view)return-1;for(let cell=0;cell<100;cell++)if(!shot(previous,cell)&&shot(next,cell)){const index=shipIndexAt(cell);if(index>=0)return index;}return-1;}
      function renderBoards(){
        cells.forEach(b=>b.className='');
        if(view)view.ships.forEach((s,index)=>{if(s[0]===255)return;for(let j=0;j<lengths[index];j++){const c=s[0]+j*(s[1]?1:10);if(cells[c])cells[c].className='ship'+(index===selectedShip?' selected':'');}});
        targets.forEach((b,i)=>{b.className='';const s=targetState(i);if(s===3)b.className='hit';else if(s===1)b.className='miss';else if(i===selectedTarget)b.className='selected-target';});
        own.forEach((b,i)=>{b.className=shipAt(i)?'ship':'';if(state&&shot(state.incoming,i))b.className=shipAt(i)?'hit':'miss';});
        const inBattle=view&&view.ready&&state&&(state.phase==='playing'||state.phase==='finished');battle.hidden=!inBattle;
        const live=Boolean(state&&state.phase==='playing');youPanel.className='side-panel'+(live&&state.myTurn?' active':'');enemyPanel.className='side-panel'+(live&&!state.myTurn?' active':'');
        const banner=byId('resultBanner');banner.className='result-banner';banner.textContent='';if(state&&state.phase==='finished'){banner.textContent=state.winner===1?'VICTORY':'DEFEAT';banner.className='result-banner show';}
        byId('hudTurn').textContent=state&&state.phase==='finished'?(state.winner===1?'VICTORY':'DEFEAT'):(state&&state.myTurn?'YOUR TURN · SELECT TARGET':'X4 PRO TURN');renderSummary();controls();
      }
      function applyFleetStatus(d){if(!Array.isArray(d.h)||d.h.length!==5||!d.h.every((n,i)=>Number.isInteger(n)&&n>=0&&n<=lengths[i]))return;let changed=-1;if(haveFleetStatus)for(let i=0;i<5;i++)if(d.h[i]>enemyHits[i]){changed=i;break;}enemyHits=d.h.slice();haveFleetStatus=true;renderSummary();if(changed>=0)impact('enemy',changed);}
      function applyState(d){
        if(!['waiting','placement','playing','finished'].includes(d.phase)||typeof d.myTurn!=='boolean'||!Number.isInteger(d.w)||!Number.isInteger(d.s)||d.s<0||d.s>31)return;
        const board=decode64(d.b,25),incoming=decode64(d.i,13);if(!board||!incoming)return;
        const ownImpact=state?newlyHitOwnShip(state.incoming,incoming):-1;
        state={phase:d.phase,myTurn:d.myTurn,winner:d.w,board,incoming,sunkMask:d.s};phase.textContent=d.phase;status.textContent='Connected to X4 Pro';
        if(d.phase!=='playing'||!d.myTurn)selectedTarget=-1;if(d.phase!=='playing')surrenderArmed=false;
        if(d.phase==='finished'){turn.textContent=d.w===1?'YOU WIN':'X4 PRO WINS';feedback.textContent=turn.textContent;}
        else if(d.phase==='playing'){turn.textContent=d.myTurn?'YOUR MOVE':'WAITING FOR X4 PRO';feedback.textContent=d.myTurn?'Select a target, then tap it again to fire.':'Waiting for X4 Pro.';}
        else if(d.phase==='waiting'&&view&&view.ready){turn.textContent='WAITING FOR X4 PRO';feedback.textContent='Your fleet is ready. Waiting for X4 Pro.';}
        else if(d.phase==='placement'&&view&&view.profile){turn.textContent='Place your fleet for the new round.';}
        else turn.textContent='';
        renderBoards();if(ownImpact>=0)impact('you',ownImpact);
      }
      async function connect(){
        const current=++generation;token='';state=null;pending=false;resuming=false;selectedTarget=-1;surrenderArmed=false;enemyHits=[0,0,0,0,0];haveFleetStatus=false;controls();renderBoards();status.textContent='Connecting…';
        try{
          const response=await fetch('/battleship/session',{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error('session');const value=await response.text();if(!/^[a-f0-9]{32}$/.test(value))throw new Error('session');if(hidden||current!==generation)return;
          token=value;socket=new WebSocket(`ws://${location.hostname}:81/battleship`);const active=socket;
          socket.onopen=()=>{if(current!==generation)return;if(resumeToken&&view&&view.ready){resuming=true;send('resume',resumeToken);feedback.textContent='Restoring your match…';}else{controls();feedback.textContent=view&&view.profile?'Place your fleet. X4 Pro can place in parallel.':'Choose your player. Your name and face appear on the X4 Pro.';}};
          socket.onmessage=event=>{
            if(current!==generation)return;let d;try{d=JSON.parse(event.data);}catch{return;}if(!d||typeof d!=='object')return;
            if(d.type==='s')applyState(d);
            else if(d.type==='f')applyFleetStatus(d);
            else if(d.type==='resume'&&/^[a-f0-9]{32}$/.test(d.token)){resumeToken=d.token;saveResume();}
            else if(d.type==='placement'&&validView(d)){view=d;revision=d.revision;pending=false;resuming=false;d.slots.forEach((n,i)=>slots[i].value=n);renderAvatar();saveResume();renderBoards();feedback.textContent=d.ready?(state&&state.phase==='playing'?'Match restored.':'Fleet confirmed. Waiting for X4 Pro.'):d.accepted?(d.profile&&d.ships.every(s=>s[0]===255)?'Player ready. Place your fleet while X4 Pro places theirs.':'Accepted by X4 Pro.'):'Move refused. Check overlap and board edges.';}
            else if(d.type==='error'){
              pending=false;if(resuming){resuming=false;resumeToken='';view=null;revision=0;saveResume();feedback.textContent='Saved match could not be restored.';}else feedback.textContent='Request refused. Check turn/state or reconnect.';controls();
            }
          };
          socket.onclose=()=>{if(current!==generation)return;token='';pending=false;resuming=false;selectedTarget=-1;surrenderArmed=false;controls();status.textContent='Connection lost · reconnecting…';phase.textContent='offline';turn.textContent='';feedback.textContent=resumeToken&&view&&view.ready?'Match paused. Reconnecting…':'Unconfirmed placement is cleared on disconnect.';if(!hidden)retry=setTimeout(connect,2000);};
          socket.onerror=()=>active.close();
        }catch{if(!hidden&&current===generation){status.textContent='Connection unavailable · retrying…';retry=setTimeout(connect,2000);}}
      }
      window.addEventListener('pagehide',()=>{hidden=true;++generation;clearTimeout(retry);token='';controls();if(socket){socket.onclose=null;socket.close();}});
      window.addEventListener('pageshow',e=>{if(e.persisted){hidden=false;connect();}});
      connect();
    </script>
  </body>
</html>
