<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CrossPlay Authenticator</title>
<style>
:root{--font:#333;--bg:#f5f5f5;--title:#2c3e50;--card:#fff;--border:#ddd;--accent:rgb(110,154,130);--danger:#b33}
@media(prefers-color-scheme:dark){:root{--font:#f5f5f5;--bg:#333;--title:#ecf0f1;--card:#444;--border:#666;color-scheme:dark}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:800px;margin:auto;padding:20px;background:var(--bg);color:var(--font)}
h1,h2{color:var(--title)} h1{border-bottom:2px solid var(--accent);padding-bottom:10px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.nav a{padding:10px 16px;text-decoration:none;color:var(--font);border-radius:4px}.nav a.active{background:var(--accent);color:white}
.card{background:var(--card);padding:20px;border-radius:8px;margin:15px 0;box-shadow:0 2px 4px #0002}
label{display:block;font-weight:600;margin-top:10px}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid var(--border);border-radius:4px}
button{margin-top:12px;padding:10px 16px;border:0;border-radius:4px;background:var(--accent);color:white;cursor:pointer}.danger{background:var(--danger)}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:10px 0;gap:10px}.muted{opacity:.72;font-size:.9em}.error{color:#d44}.ok{color:#2a5}
</style>
</head>
<body>
<h1>CrossPlay</h1>
<div class="nav">
<a href="/">Home</a><a href="/files">File Manager</a><a href="/settings">Settings</a><a href="/fonts">Fonts</a><a class="active" href="/authenticator">Authenticator</a>
</div>
<div class="card">
<h2>TOTP Vault</h2>
<p class="muted">This page is served by the temporary reader web interface. PIN and TOTP secrets travel over your local HTTP connection, so only use it on a trusted network.</p>
<label>Vault PIN</label><input id="pin" type="password" inputmode="numeric" minlength="6" maxlength="12" placeholder="6-12 digits" />
<button onclick="loadAccounts()">Unlock / Refresh</button>
<div id="status" class="muted"></div>
</div>
<div class="card">
<h2>Add account</h2>
<label>Name</label><input id="name" maxlength="39" placeholder="e.g. GitHub" />
<label>Base32 secret</label><input id="secret" type="password" maxlength="96" autocomplete="off" placeholder="JBSWY3DPEHPK3PXP" />
<button onclick="addAccount()">Add account</button>
</div>
<div class="card"><h2>Accounts</h2><div id="accounts" class="muted">Unlock the vault to load accounts.</div></div>
<script>
function pin(){return document.getElementById('pin').value.trim()}
function setStatus(msg,ok){const e=document.getElementById('status');e.textContent=msg;e.className=ok?'ok':'error'}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const t=await r.text();if(!r.ok)throw new Error(t||('HTTP '+r.status));return t?JSON.parse(t):{}}
async function loadAccounts(){try{const d=await post('/api/totp/list',{pin:pin()});const box=document.getElementById('accounts');box.innerHTML='';if(!d.accounts.length){box.textContent='No accounts yet.'}else d.accounts.forEach(a=>{const row=document.createElement('div');row.className='row';const s=document.createElement('span');s.textContent=a.name+' · '+a.digits+' digits · '+a.period+'s';const b=document.createElement('button');b.className='danger';b.textContent='Delete';b.onclick=()=>del(a.index);row.append(s,b);box.append(row)});setStatus(d.created?'New encrypted vault created.':'Vault unlocked.',true)}catch(e){setStatus(e.message,false)}}
async function addAccount(){try{await post('/api/totp',{pin:pin(),name:document.getElementById('name').value.trim(),secret:document.getElementById('secret').value.trim()});document.getElementById('secret').value='';await loadAccounts()}catch(e){setStatus(e.message,false)}}
async function del(index){if(!confirm('Delete this TOTP account?'))return;try{await post('/api/totp/delete',{pin:pin(),index:index});await loadAccounts()}catch(e){setStatus(e.message,false)}}
</script>
</body></html>
