[platformio]
default_envs = x4pro

[inx]
version = 1.0.20
x4pro_prerelease = 6

[base]
; X4 Pro is an ESP32-S3 N16R8. Use the same verified PioArduino toolchain as
; current CrossPoint X4 Pro builds instead of the old ESP32-C3 platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; Keep inherited Inx low-severity style/performance findings visible without
; making the X4 Pro port impossible to merge. Medium/high findings remain
; blocking in CI.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --suppress=constVariableReference:*FontManager.cpp --suppress=useStlAlgorithm:*FontManager.cpp --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

; SAFETY: never let PlatformIO perform its normal full-device upload for this
; experimental port. Normal PlatformIO uploads may write the bootloader and
; partition table. Hardware tests must go through the dedicated inactive-slot
; flasher after validating the device's live partition table.
upload_protocol = custom
upload_command = $PYTHONEXE scripts/refuse_x4pro_upload.py

build_flags =
  -I${PROJECT_DIR}/src/system
  -Iopen-x4-sdk/libs/hardware/SDCardManager/include
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
  -DUSE_UTF8_LONG_NAMES=1
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_X4PRO=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DINX_X4PRO_PORT=1

build_unflags =
  -std=gnu++11

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.arduino.memory_type = dio_opi
; This table is used only to link/size the application during development.
; DO NOT flash partitions.bin to an X4 Pro. The live factory-compatible table
; must be preserved and inspected before the first hardware test.
board_build.partitions = partitions.csv

build_src_filter =
  +<*>
  -<simulator/>
  -<network/OtaUpdaterDisabled.cpp>

extra_scripts =
  pre:scripts/build_html.py

lib_deps =
  BoardConfig=symlink://open-x4-sdk/libs/hardware/BoardConfig
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  FrontlightManager=symlink://open-x4-sdk/libs/hardware/FrontlightManager
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  Rtc=symlink://open-x4-sdk/libs/hardware/Rtc
  EInkDisplay=symlink://open-x4-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://open-x4-sdk/libs/hardware/PowerManager
  XteinkDetect=symlink://open-x4-sdk/libs/hardware/XteinkDetect
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  links2004/WebSockets @ 2.7.3

[env:x4pro]
extends = base
build_flags =
  ${base.build_flags}
  -DINX_VERSION=\"${inx.version}-X4PRO-ALPHA.${inx.x4pro_prerelease}\"
  -DENABLE_SERIAL_LOG

; Kept under the historical name because release.yml invokes this environment.
; It is still X4-Pro-only and inherits the upload refusal above.
[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DINX_VERSION=\"${inx.version}-X4PRO-ALPHA.${inx.x4pro_prerelease}\"

[env:simulator]
platform = native
custom_run_simulator_target_owner = project
build_src_filter =
  +<*>
  -<simulator/web/>
  -<network/OtaUpdater.cpp>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -Wno-c++11-narrowing
  -DSIMULATOR
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DINX_VERSION=\"${inx.version}-simulator\"
  -DCROSSPOINT_VERSION=\"${inx.version}-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DDISABLE_FS_H_WARNING=1
  -include${PROJECT_DIR}/src/simulator/SimulatorCompat.h
  -Isrc/simulator
  -Isrc
  -Isrc/system
  -Ilib/GfxRenderer
  -Ilib/EpdFont
  -Ilib/FsHelpers
  -Ilib/JpegToBmpConverter
  -Ilib/PngToBmpConverter
  -Ilib/Serialization
  -Ilib/Utf8
  -Ilib/Txt
  -Ilib/Epub
  -Ilib/OpdsParser
  -Ilib/KOReaderSync
  -Ilib/Xtc
  -Ilib/ZipFile
  -Ilib/miniz
  -Ilib/InflateReader
lib_ignore = hal, WebSockets, PNGdec, JPEGDEC
extra_scripts =
  pre:scripts/build_html.py
  post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1

[env:simulator_web]
platform = native
custom_run_simulator_target_owner = project
build_src_filter =
  +<simulator/web/web_dashboard_main.cpp>
  +<network/LocalServer.cpp>
  +<state/SystemSetting.cpp>
  +<state/ReaderSetting.cpp>
  +<state/NetworkCredential.cpp>
  +<dictionary/StarDictLookup.cpp>
  +<util/StringUtils.cpp>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -Wno-c++11-narrowing
  -DSIMULATOR
  -DINX_SIMULATOR_WEB_ONLY
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DINX_VERSION=\"${inx.version}-simulator-web\"
  -DCROSSPOINT_VERSION=\"${inx.version}-simulator-web\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DDISABLE_FS_H_WARNING=1
  -include${PROJECT_DIR}/src/simulator/SimulatorCompat.h
  -Isrc/simulator/web
  -Isrc/simulator
  -Isrc
  -Isrc/system
lib_ignore = hal, WebSockets, KOReaderSync, Epub, FsHelpers, GfxRenderer, EpdFont
extra_scripts =
  pre:scripts/build_html.py
  post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
