name: Apply player web UI

on:
  push:
    branches: [feature/player-system]
    paths:
      - '.github/scripts/apply_player_web_ui.py'
      - '.github/workflows/apply-player-web-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/player-system
          fetch-depth: 0
      - name: Apply player web UI patch
        run: python3 .github/scripts/apply_player_web_ui.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/apps_local/player/PlayerWebApi.cpp \
                  src/apps_local/battleship/web/BattleshipBrowserServer.cpp \
                  src/apps_local/battleship/web/BattleshipPage.html
          git diff --cached --check
          git commit -m 'feat(player): add player controls to web interface'
          git push origin HEAD:feature/player-system
