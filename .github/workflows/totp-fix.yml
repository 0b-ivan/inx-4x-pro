name: Authenticator fixup

on:
  push:
    branches: [feature/totp-authenticator]
    paths:
      - .github/workflows/totp-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/totp-authenticator
      - name: Fix build and formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/apps_local/totp/TotpActivity.cpp')
          s = p.read_text()
          old = '      add.action = store_.count < kMaxAccounts ? kActionAdd : fui::ActionNone;\n'
          new = '      add.action = kActionAdd;\n'
          if old not in s:
              raise SystemExit('ActionNone line not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/apps_local/Shelf.cpp')
          s = p.read_text()
          s = s.replace('  {"RSS READER", &icon_hackernews_32, &RssFeedListActivity::create},\n',
                        '    {"RSS READER", &icon_hackernews_32, &RssFeedListActivity::create},\n', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps_local/totp/TotpActivity.cpp src/apps_local/Shelf.cpp
          git commit -m "fix: make authenticator build on FreeInkUI"
          git push origin HEAD:feature/totp-authenticator
