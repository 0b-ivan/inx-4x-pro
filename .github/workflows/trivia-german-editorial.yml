# Independent bilingual AI editorial pilot. Runs only when the owner creates
# or updates the separate trigger file on the existing Draft PR branch.
# No firmware, release, merge, auto-approval or bulk translation.
name: German Trivia Independent Editorial Pilot

on:
  push:
    branches:
      - fix/i18n-translation-quality-audit
    paths:
      - .github/trivia-editor-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: trivia-german-editorial-qa
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == '0b-ivan/inx-4x-pro'
    name: GPT-5.4 reviews 20 Claude question drafts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Draft PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate editor implementation offline before any API spending
        run: python3 tools_local/trivia/test_de_pack.py

      - name: Obtain exact released English questions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivia-editor"
          curl -fsSL --retry 3 --max-time 90 \
            'https://github.com/ma-r-s/crossplay/releases/download/trivia-pack/pack.dat' \
            -o "$RUNNER_TEMP/trivia-editor/pack.dat"
          printf '%s  %s\n' \
            'a17435136122ce1d2485d4c4c30e58206e6dffc88b819e0d4c646081b485f9cf' \
            "$RUNNER_TEMP/trivia-editor/pack.dat" | sha256sum -c -
          python3 tools_local/trivia/export_pack.py \
            --pack "$RUNNER_TEMP/trivia-editor/pack.dat" \
            --out "$RUNNER_TEMP/trivia-editor/source-en.jsonl"

      - name: Reuse existing twenty-question Claude pilot output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40300699483 --repo "$GITHUB_REPOSITORY" \
            --name trivia-german-pilot-unreviewed \
            --dir "$RUNNER_TEMP/trivia-editor"
          test "$(wc -l < "$RUNNER_TEMP/trivia-editor/questions-de-draft.jsonl")" -eq 20
          python3 tools_local/trivia/normalize_de_drafts.py \
            --src "$RUNNER_TEMP/trivia-editor/questions-de-draft.jsonl" \
            --out "$RUNNER_TEMP/trivia-editor/questions-de-clean.jsonl"

      - name: Independent GPT-5.4 German editorial review (max twenty)
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::Missing temporary OPENROUTER_API_KEY Actions secret."
            exit 1
          fi
          python3 tools_local/trivia/review_de_pack.py \
            --src "$RUNNER_TEMP/trivia-editor/source-en.jsonl" \
            --drafts "$RUNNER_TEMP/trivia-editor/questions-de-clean.jsonl" \
            --out "$RUNNER_TEMP/trivia-editor/questions-de-editorial.jsonl" \
            --report "$RUNNER_TEMP/trivia-editor/editorial-report.jsonl" \
            --model 'openai/gpt-5.4' \
            --limit 20

      - name: Upload editorial report and corrected drafts for human approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivia-german-gpt54-editorial-unreviewed
          path: |
            ${{ runner.temp }}/trivia-editor/questions-de-editorial.jsonl
            ${{ runner.temp }}/trivia-editor/editorial-report.jsonl
          if-no-files-found: ignore
          retention-days: 1
