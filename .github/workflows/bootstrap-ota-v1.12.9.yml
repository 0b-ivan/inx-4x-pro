name: Bootstrap OTA v1.12.9

on:
  push:
    branches:
      - feature/crossplay-games

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'chore: bootstrap OTA v1.12.9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crossplay-games
          submodules: recursive
          fetch-depth: 0

      - name: Prepare permanent v1.12.9 source commit
        id: prepare
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ini = Path('platformio.ini')
          text = ini.read_text()
          old = '[crossplay]\nversion = 1.12.8'
          new = '[crossplay]\nversion = 1.12.9'
          if old not in text:
              raise SystemExit('expected CrossPlay 1.12.8 version block not found')
          ini.write_text(text.replace(old, new, 1))

          wf = Path('.github/workflows/crossplay-release.yml')
          text = wf.read_text()
          old_heading = '            ### What is new in 1.12.8\n'
          if old_heading not in text:
              raise SystemExit('expected 1.12.8 release-notes heading not found')
          new_notes = '''            ### What is new in 1.12.9

            **OTA updates now come from `0b-ivan/inx-4x-pro`.** The X4 Pro
            checks this repository's latest release and downloads only the
            application image `firmware.bin` into the inactive OTA slot. The
            ESP32-S3 chip check and embedded board-identity check still run
            before the new slot can become bootable.

            **This release establishes the first strict SemVer baseline in this
            fork.** Earlier repository releases used `-x4pro-alpha.N` tags, so
            the normal release-notes gate had no previous `vMAJOR.MINOR.PATCH`
            tag to compare against. Future releases can use the normal release
            workflow without this bootstrap.

            ### What was new in 1.12.8
'''
          wf.write_text(text.replace(old_heading, new_notes, 1))
          PY

          # This workflow is deliberately one-shot. The release commit must not
          # leave a branch-push publisher behind.
          rm .github/workflows/bootstrap-ota-v1.12.9.yml

          # Source-level invariants before committing anything.
          grep -q '^version = 1.12.9$' <(awk '/^\[crossplay\]/{f=1;next} /^\[/{f=0} f' platformio.ini)
          grep -Fq 'https://api.github.com/repos/0b-ivan/inx-4x-pro/releases/latest' src/network/OtaUpdater.cpp
          grep -Fq '#define CROSSPOINT_RELEASE_ASSET "firmware.bin"' src/network/FirmwareBoardTag.h
          grep -Fq '### What is new in 1.12.9' .github/workflows/crossplay-release.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare CrossPlay v1.12.9 OTA'
          git push origin HEAD:feature/crossplay-games
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release toolchain
        run: pip install --upgrade platformio esptool

      - name: Build OTA application images
        run: |
          pio run -e gh_release_x4pro
          pio run -e gh_release_sticky

      - name: Validate and stage OTA assets
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/gh_release_x4pro/firmware.bin dist/firmware.bin
          cp .pio/build/gh_release_sticky/firmware.bin dist/firmware-sticky.bin

          python - <<'PY'
          from pathlib import Path

          SLOT_SIZE = 0x007F0000
          OTA_URL = b'https://api.github.com/repos/0b-ivan/inx-4x-pro/releases/latest'

          for filename, board in (
              ('dist/firmware.bin', 'x4pro'),
              ('dist/firmware-sticky.bin', 'sticky'),
          ):
              data = Path(filename).read_bytes()
              if not data or data[0] != 0xE9:
                  raise SystemExit(f'{filename}: invalid ESP application image magic')
              chip_id = int.from_bytes(data[12:14], 'little')
              if chip_id != 9:  # ESP32-S3 IMAGE_CHIP_ID
                  raise SystemExit(f'{filename}: wrong image chip id {chip_id}, expected ESP32-S3 (9)')
              if len(data) > SLOT_SIZE:
                  raise SystemExit(f'{filename}: {len(data)} bytes exceeds X4 Pro OTA slot {SLOT_SIZE}')
              board_tag = f'CROSSPOINT-BOARD-V1:{board};'.encode()
              if board_tag not in data:
                  raise SystemExit(f'{filename}: missing board tag {board_tag!r}')
              if OTA_URL not in data:
                  raise SystemExit(f'{filename}: firmware does not contain this repository OTA endpoint')
              print(f'{filename}: OK size={len(data)} chip=ESP32-S3 board={board}')
          PY

          sha256sum dist/firmware.bin dist/firmware-sticky.bin

      - name: Publish v1.12.9
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.9
          target_commitish: ${{ steps.prepare.outputs.sha }}
          name: CrossPlay v1.12.9
          prerelease: false
          make_latest: true
          files: |
            dist/firmware.bin
            dist/firmware-sticky.bin
          body: |
            First OTA release from `0b-ivan/inx-4x-pro` using a strict SemVer tag.

            - X4 Pro OTA asset: `firmware.bin`
            - Sticky OTA asset: `firmware-sticky.bin`
            - Application images only; no bootloader or partition table is published by this bootstrap
            - ESP32-S3 image header, board identity tag, repository OTA endpoint, and X4 Pro slot size are validated before publishing

            X4 Pro devices on CrossPlay 1.12.8 will now discover 1.12.9 through this repository's `/releases/latest` endpoint.
