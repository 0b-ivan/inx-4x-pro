name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Validate safety scripts
        run: |
          python -m py_compile scripts/x4pro_inspect.py
          python -m py_compile scripts/refuse_x4pro_upload.py
          python -m py_compile scripts/validate_release.py

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run cppcheck
        # Inx currently has a backlog of low-severity style/performance findings.
        # Keep reporting them, but gate the port on medium/high defects.
        run: pio check -e x4pro --fail-on-defect medium --fail-on-defect high

      - name: Run clang-format on X4 Pro port
        # The inherited Inx tree is not clang-format-21 clean. Gate the files
        # owned by this hardware port instead of rewriting unrelated upstream code.
        run: |
          FILES=(
            lib/hal/HalDisplay.cpp
            lib/hal/HalGPIO.cpp
            lib/hal/HalGPIO.h
            src/network/OtaUpdaterDisabled.cpp
          )
          /usr/lib/llvm-21/bin/clang-format -style=file -i "${FILES[@]}"
          git diff --exit-code -- "${FILES[@]}" || {
            echo "X4 Pro port files are not clang-format clean"
            exit 1
          }

      - name: Build X4 Pro
        run: pio run -e x4pro
