# CAW translation QA is independent of firmware/gameplay CI and uses no secrets.
name: CardParty Translation QA

on:
  push:
    branches:
      - feature/cards-against-whatever
    paths:
      - 'tools_local/cardparty_l10n/**'
      - '.github/workflows/cardparty-translation-qa.yml'
  pull_request:
    paths:
      - 'tools_local/cardparty_l10n/**'
      - '.github/workflows/cardparty-translation-qa.yml'

permissions:
  contents: read

concurrency:
  group: cardparty-translation-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Offline schema, source license, placeholders and review gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline card translation regression suite
        run: python3 -m unittest discover -s tools_local/cardparty_l10n -p 'test_*.py' -v
      - name: Validate original example source without calling OpenRouter
        run: |
          python3 tools_local/cardparty_l10n/translate_cards.py validate \
            --manifest tools_local/cardparty_l10n/examples/deck.json \
            --source tools_local/cardparty_l10n/examples/cards-en.jsonl \
            --drafts tools_local/cardparty_l10n/examples/cards-de-unreviewed.jsonl

      - name: Validate edited German proposals against exact source hashes
        run: |
          python3 tools_local/cardparty_l10n/translate_cards.py validate \
            --manifest tools_local/cardparty_l10n/examples/deck.json \
            --source tools_local/cardparty_l10n/examples/cards-en.jsonl \
            --drafts tools_local/cardparty_l10n/examples/cards-de-editorial-proposed.jsonl
      - name: Detect grammar, punctuation and meaning regression heuristics
        run: |
          python3 tools_local/cardparty_l10n/editorial_checks.py \
            --manifest tools_local/cardparty_l10n/examples/deck.json \
            --source tools_local/cardparty_l10n/examples/cards-en.jsonl \
            --drafts tools_local/cardparty_l10n/examples/cards-de-editorial-proposed.jsonl
