name: Apply player web boundary fix

on:
  push:
    branches: [feature/player-system]
    paths:
      - '.github/scripts/apply_player_web_boundary_fix.py'
      - '.github/workflows/apply-player-web-boundary-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/player-system
      - run: python3 .github/scripts/apply_player_web_boundary_fix.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/apps_local/battleship/web/BattleshipBrowserServer.cpp
          git diff --cached --check
          git commit -m 'fix(player): preserve browser reply boundary'
          git push origin HEAD:feature/player-system
