name: Prepare v1.12.19

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-v1.12.19.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Bump CrossPlay version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platformio.ini')
          s = p.read_text()
          old = '[crossplay]\nversion = 1.12.18\n'
          new = '[crossplay]\nversion = 1.12.19\n'
          if old not in s:
              raise SystemExit('expected CrossPlay 1.12.18 version block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platformio.ini
          git commit -m "release: bump CrossPlay to 1.12.19"
          git push origin HEAD:main
