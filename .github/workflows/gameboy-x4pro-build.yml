name: Game Boy X4 Pro Build

on:
  push:
    branches: [feature/gameboy-emulator]
  pull_request:
    branches: [x4pro-port]

permissions:
  contents: read

concurrency:
  group: gameboy-x4pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check whitespace
        run: git diff --check x4pro-port...HEAD

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build X4 Pro application
        run: pio run -e x4pro

      - name: Validate application artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          firmware = Path('.pio/build/x4pro/firmware.bin')
          if not firmware.is_file():
              raise SystemExit('firmware.bin missing')
          size = firmware.stat().st_size
          limit = 0x640000
          print(f'firmware.bin: {size} bytes; conservative limit: {limit} bytes')
          if size > limit:
              raise SystemExit('firmware.bin exceeds conservative OTA slot limit')
          PY

      - name: Upload application-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: inx-x4pro-gameboy-${{ github.sha }}
          path: .pio/build/x4pro/firmware.bin
          if-no-files-found: error
