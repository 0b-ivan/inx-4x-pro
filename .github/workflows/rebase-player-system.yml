  player::GameStats stats{};
  CHECK(store.getGameStats(ivan.id, player::GameId::Chess, stats) == player::StoreResult::Ok);
  CHECK(stats.wins == 1);
  CHECK(stats.xp == 70);
  CHECK(stats.currentStreak == 1);

  player::PlayerId empty{};
  CHECK(service.recordOutcome(empty, player::GameId::Battleship, player::MatchOutcome::Win) ==
        player::PlayerServiceResult::InvalidArgument);
  CHECK(service.recordOutcome(ivan.id, player::GameId::Unknown, player::MatchOutcome::Win) ==
        player::PlayerServiceResult::InvalidArgument);
  CHECK(service.recordOutcome(ivan.id, player::GameId::Battleship, player::MatchOutcome::Win, &guest) ==
        player::PlayerServiceResult::InvalidArgument);

  store.close();
  removeDatabase(path);
}

