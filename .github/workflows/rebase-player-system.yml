          addition = '''void testSingleLocalOutcome() {
  const std::string path = tempDatabase("single-outcome");
  removeDatabase(path);

  player::PlayerStore store;
  CHECK(store.open(path.c_str()) == player::StoreResult::Ok);
  RandomState random{};
  player::PlayerService service(store, deterministicRandom, &random);

  player::GuestSession guest{};
  CHECK(service.createGuest(guest) == player::PlayerServiceResult::Ok);
  CHECK(service.recordOutcome(guest.id, player::GameId::Battleship, player::MatchOutcome::Win, &guest) ==
        player::PlayerServiceResult::Ok);
  const player::GuestGameStats* guestStats = guest.statsFor(player::GameId::Battleship);
  CHECK(guestStats != nullptr);
  CHECK(guestStats->wins == 1);
  CHECK(guestStats->xp == 50);
  CHECK(guestStats->currentStreak == 1);
  CHECK(guest.completedMatches == 1);

  CHECK(service.recordOutcome(guest.id, player::GameId::Battleship, player::MatchOutcome::Loss, &guest) ==
        player::PlayerServiceResult::Ok);
  CHECK(guestStats->losses == 1);
  CHECK(guestStats->xp == 65);
  CHECK(guestStats->currentStreak == 0);
  CHECK(guest.completedMatches == 2);

  const player::Player ivan = makePlayer(70, "IVAN");
  CHECK(store.createPlayer(ivan) == player::StoreResult::Ok);
  CHECK(service.recordOutcome(ivan.id, player::GameId::Chess, player::MatchOutcome::Win) ==
