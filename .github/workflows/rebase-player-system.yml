name: Wire Battleship player progression

on:
  push:
    branches:
      - automation/rebase-player-system-20260911

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply progression integration
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/wire_player_progression.py /tmp/wire_player_progression.py
          git fetch origin main feature/player-system
          git checkout feature/player-system
          python3 /tmp/wire_player_progression.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps_local/player/PlayerService.h \
                  src/apps_local/player/PlayerService.cpp \
                  src/apps_local/player/PlayerRuntime.h \
                  src/apps_local/player/PlayerRuntime.cpp \
                  src/apps_local/battleship/BattleshipActivity.h \
                  src/apps_local/battleship/BattleshipActivity.cpp \
                  src/apps_local/battleship/web/BattleshipLocalPlayActivity.h \
                  src/apps_local/battleship/web/BattleshipLocalPlayActivity.cpp \
                  host-tests/player/test_service.cpp
          git diff --cached --check
          git commit -m "feat(battleship): record browser player progression"
          git push origin HEAD:feature/player-system
