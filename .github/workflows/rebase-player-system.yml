        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {found}")
              text = text.replace(old, new, count)
              p.write_text(text)

