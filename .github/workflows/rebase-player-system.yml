          replace(
              "src/apps_local/player/PlayerService.cpp",
              '''PlayerServiceResult PlayerService::matchFinished(const MatchFinishedEvent& event, GuestSession* guests,
                                                 const size_t guestCount) {
''',
              '''PlayerServiceResult PlayerService::recordOutcome(const PlayerId& playerId, const GameId game,
                                                 const MatchOutcome outcome, GuestSession* guest) {
  if (!validGame(game) || !validOutcome(outcome) || playerId.empty()) {
    return PlayerServiceResult::InvalidArgument;
  }

  if (guest != nullptr) {
    if (!guest->active() || guest->id != playerId) return PlayerServiceResult::InvalidArgument;
    GuestGameStats* current = guest->statsFor(game);
    if (current == nullptr) return PlayerServiceResult::InvalidArgument;

    GuestGameStats next = *current;
    applyOutcome(next, outcome, xpForMatch(game, outcome));
    *current = next;
    guest->completedMatches = saturatingAdd16(guest->completedMatches, 1U);
    return PlayerServiceResult::Ok;
  }

  GameStats stats{};
  const PlayerServiceResult loaded = loadPersistentStats(store_, playerId, game, stats);
  if (loaded != PlayerServiceResult::Ok) return loaded;

  applyOutcome(stats, outcome, xpForMatch(game, outcome));
  const StoreResult saved = store_.saveGameStats(stats);
  if (saved == StoreResult::NotFound) return PlayerServiceResult::PlayerNotFound;
  if (saved != StoreResult::Ok) return PlayerServiceResult::StorageError;
  return PlayerServiceResult::Ok;
}

PlayerServiceResult PlayerService::matchFinished(const MatchFinishedEvent& event, GuestSession* guests,
                                                 const size_t guestCount) {
