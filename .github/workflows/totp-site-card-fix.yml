name: Authenticator site card fixup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/totp-site-card-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Keep site truthful without a fake screenshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          card = '''    <article class="card">\n      <span class="tag">App · offline</span>\n      <h3>Authenticator</h3>\n      <p>Store multiple TOTP accounts on the device and generate six-digit codes offline. The secret never needs a cloud service.</p>\n    </article>\n\n'''
          if card not in s:
              raise SystemExit('Authenticator no-shot card not found')
          s = s.replace(card, '', 1)
          anchor = '  <p class="shelf-hint">Swipe for the rest</p>\n'
          note = '''  <p class="shelf-hint">Also on the Apps shelf: <strong>Authenticator</strong>, for multiple offline TOTP accounts.</p>\n\n  <p class="shelf-hint">Swipe for the rest</p>\n'''
          if anchor not in s:
              raise SystemExit('shelf hint anchor not found')
          p.write_text(s.replace(anchor, note, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "fix: satisfy site gate without fake authenticator shot"
          git push origin HEAD:main
