name: Battleship browser input lock once

on:
  push:
    branches: [feature/battleship-browser-input-lock]
    paths:
      - ".github/workflows/battleship-browser-input-lock-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/battleship-browser-input-lock
          fetch-depth: 0

      - name: Apply browser gesture guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/apps_local/battleship/web/BattleshipPage.html')
          text = page.read_text()

          old = "      * { box-sizing:border-box; }\n"
          new = """      * { box-sizing:border-box; }
      html { touch-action:manipulation; }
      html:has(main.in-battle),body:has(main.in-battle) { height:100%; overflow:hidden; overscroll-behavior:none; }
      main.in-battle { -webkit-touch-callout:none; }
"""
          if old not in text:
              raise SystemExit('CSS insertion point not found')
          text = text.replace(old, new, 1)

          old = "      const shell=byId('app'),status=byId('status'),phase=byId('phase'),turn=byId('turn'),profile=byId('profile'),placement=byId('placement'),feedback=byId('feedback'),battle=byId('battle'),rematch=byId('rematch'),surrender=byId('surrender'),hud=byId('hud'),setupState=byId('setupState'),youPanel=byId('youPanel'),enemyPanel=byId('enemyPanel'),eventBanner=byId('eventBanner');\n"
          new = old + """      window.addEventListener('contextmenu',event=>event.preventDefault());
      const lockBattleScroll=event=>{if(shell.className.split(/\\s+/).includes('in-battle'))event.preventDefault();};
      window.addEventListener('touchmove',lockBattleScroll,{passive:false});
      window.addEventListener('wheel',lockBattleScroll,{passive:false});
"""
          if old not in text:
              raise SystemExit('JS insertion point not found')
          text = text.replace(old, new, 1)
          page.write_text(text)

          test = Path('host-tests/battleship/test_browser_page.cjs')
          text = test.read_text()
          old = "  assert.match(html,/side-panel\\.active/);\n"
          new = old + """  assert.match(html,/touch-action:manipulation/);
  assert.match(html,/body:has\\(main\\.in-battle\\)/);
  assert.match(html,/contextmenu/);
  assert.match(html,/touchmove/);
  assert.match(html,/wheel/);
"""
          if old not in text:
              raise SystemExit('test insertion point not found')
          text = text.replace(old, new, 1)
          test.write_text(text)
          PY

      - name: Run Battleship host tests
        run: bash host-tests/battleship/run.sh

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps_local/battleship/web/BattleshipPage.html host-tests/battleship/test_browser_page.cjs
          git commit -m "fix(battleship): lock browser game gestures"
          git push origin HEAD:feature/battleship-browser-input-lock
