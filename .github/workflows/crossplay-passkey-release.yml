name: CrossPlay passkey release

on:
  push:
    tags:
      - "v*-passkey"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crossplay-passkey-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PIO_CORE_URL: https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag must match the passkey firmware version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(awk '/^\[passkey\]/{f=1;next} /^\[/{f=0} f && /^version *=/{print $3; exit}' platformio.passkey.ini)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match [passkey] version ${VERSION}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches [passkey] version ${VERSION}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-passkey-release-${{ hashFiles('platformio.ini', 'platformio.passkey.ini') }}

      - name: Install PlatformIO Core and tooling
        run: uv pip install --system -U "$PIO_CORE_URL" esptool

      - name: Build passkey firmware
        run: python3 -m platformio run --project-conf platformio.passkey.ini -e x4pro_passkey

      - name: Name passkey artefacts
        run: |
          mkdir -p dist
          BUILD=.pio/build/x4pro_passkey
          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     "$BUILD/bootloader.bin" \
            0x8000  "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"
          cp "$BUILD/firmware.bin" dist/firmware-passkey.bin
          cp "$BUILD/firmware.elf" "dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey.elf"

      - name: Validate passkey artefacts
        run: |
          set -euo pipefail
          full="dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey-full.bin"
          test -s dist/firmware-passkey.bin
          test -s "$full"
          test -s "dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey.elf"
          test "$(dd if="$full" bs=1 skip=0 count=2 2>/dev/null | xxd -p)" = "e903"
          test "$(dd if="$full" bs=1 skip=32768 count=2 2>/dev/null | xxd -p)" = "aa50"
          test "$(dd if="$full" bs=1 skip=65536 count=2 2>/dev/null | xxd -p)" = "e907"
          if cmp -s partitions.csv "$BUILD/partitions.bin"; then
            : # binary table is expected to differ from source CSV representation
          fi
          python -m esptool image-info dist/firmware-passkey.bin | tee /tmp/passkey-image-info.txt
          grep -qi "ESP32-S3\|ESP32S3" /tmp/passkey-image-info.txt

      - name: Publish passkey release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          body: |
            CrossPlay **USB Passkey** firmware for Xteink X4 Pro.

            ### Passkey 1.12.25
            - FIDO2/CTAP2 USB HID authenticator.
            - authenticatorMakeCredential and authenticatorGetAssertion with ES256/P-256.
            - Explicit one-shot physical user-presence confirmation on the X4 Pro.
            - CTAPHID_KEEPALIVE / UP_NEEDED while waiting for confirmation.
            - Encrypted AES-256-GCM credential vault.
            - Dedicated OTA asset `firmware-passkey.bin`; normal X4 Pro firmware continues to use `firmware.bin`.

            ### Security status
            The credential vault root key is still stored in ordinary NVS. This build is not hardware-backed and does not burn or modify eFuses.

            ### Install
            - Passkey OTA image: `firmware-passkey.bin`
            - USB/recovery image: `crossplay-<version>-x4pro-passkey-full.bin`
            - Debug symbols: `crossplay-<version>-x4pro-passkey.elf`
