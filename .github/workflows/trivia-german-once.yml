# One-shot user-requested 20-question German quiz translation pilot.
# Only a change to .github/trivia-pilot-trigger.txt on the named PR branch
# triggers this workflow; ordinary commits, PRs and releases do not.
name: German Trivia One-Shot Pilot

on:
  push:
    branches:
      - fix/i18n-translation-quality-audit
    paths:
      - .github/trivia-pilot-trigger.txt

permissions:
  contents: read

concurrency:
  group: trivia-german-pilot-once
  cancel-in-progress: false

jobs:
  translate:
    if: github.repository == '0b-ivan/inx-4x-pro'
    name: Translate 20 questions only
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify and export English questions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivia-pilot"
          curl -fsSL --retry 3 --max-time 90 \
            https://github.com/ma-r-s/crossplay/releases/download/trivia-pack/pack.dat \
            -o "$RUNNER_TEMP/trivia-pilot/pack.dat"
          printf '%s  %s\n' \
            'a17435136122ce1d2485d4c4c30e58206e6dffc88b819e0d4c646081b485f9cf' \
            "$RUNNER_TEMP/trivia-pilot/pack.dat" | sha256sum -c -
          python3 tools_local/trivia/export_pack.py \
            --pack "$RUNNER_TEMP/trivia-pilot/pack.dat" \
            --out "$RUNNER_TEMP/trivia-pilot/source-en.jsonl"

      - name: Draft up to 20 German question translations
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::Missing OPENROUTER_API_KEY repository secret"
            exit 1
          fi
          python3 tools_local/trivia/translate_de_pack.py \
            --src "$RUNNER_TEMP/trivia-pilot/source-en.jsonl" \
            --out "$RUNNER_TEMP/trivia-pilot/questions-de-draft.jsonl" \
            --model 'anthropic/claude-sonnet-4.6' \
            --limit 20

      - name: Save the unreviewed draft (one-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivia-german-pilot-unreviewed
          path: ${{ runner.temp }}/trivia-pilot/questions-de-draft.jsonl
          if-no-files-found: ignore
          retention-days: 1
