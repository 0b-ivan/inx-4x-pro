# Qwen 500-question budget test; no published German question pack.
name: German Trivia Qwen 500 Controlled Batch
on:
  push:
    branches:
      - experiment/trivia-de-100-20261026
    paths:
      - .github/trivia-qwen-500-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: german-trivia-qwen-500
  cancel-in-progress: false

jobs:
  translate-and-audit:
    if: github.repository == '0b-ivan/inx-4x-pro'
    name: Reuse 20 + draft 480 Qwen questions + selective GPT-5.4 review
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline translation and numeric regression tests
        run: |
          python3 tools_local/trivia/test_numerical_equivalence.py
          python3 tools_local/trivia/test_de_pack.py
      - name: Verify original English pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivia-qwen500"
          curl -fsSL --retry 3 --max-time 90 \
            'https://github.com/ma-r-s/crossplay/releases/download/trivia-pack/pack.dat' \
            -o "$RUNNER_TEMP/trivia-qwen500/pack.dat"
          printf '%s  %s\n' \
            'a17435136122ce1d2485d4c4c30e58206e6dffc88b819e0d4c646081b485f9cf' \
            "$RUNNER_TEMP/trivia-qwen500/pack.dat" | sha256sum -c -
          python3 tools_local/trivia/export_pack.py \
            --pack "$RUNNER_TEMP/trivia-qwen500/pack.dat" \
            --out "$RUNNER_TEMP/trivia-qwen500/source-en.jsonl"
      - name: Restore saved Qwen pilot results (no retranslation)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40317248535 --repo "$GITHUB_REPOSITORY" \
            --name trivia-cheap-20-comparison-unreviewed \
            --dir "$RUNNER_TEMP/trivia-qwen500"
          python3 tools_local/trivia/qwen_500_experiment.py seed \
            --source "$RUNNER_TEMP/trivia-qwen500/source-en.jsonl" \
            --comparison "$RUNNER_TEMP/trivia-qwen500/comparison-per-question.jsonl" \
            --output "$RUNNER_TEMP/trivia-qwen500/qwen-500-drafts.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/trivia-qwen500/qwen-500-drafts.jsonl")" -eq 20
      - name: Translate 480 additional questions with spending guard
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRIVIA_USAGE_LOG: ${{ runner.temp }}/trivia-qwen500/translation-usage.jsonl
          TRIVIA_SPEND_LIMIT_USD: '0.35'
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python3 tools_local/trivia/translate_de_pack.py \
            --src "$RUNNER_TEMP/trivia-qwen500/source-en.jsonl" \
            --out "$RUNNER_TEMP/trivia-qwen500/qwen-500-drafts.jsonl" \
            --model 'qwen/qwen3-235b-a22b-2507' \
            --limit 480
          test "$(wc -l < "$RUNNER_TEMP/trivia-qwen500/qwen-500-drafts.jsonl")" -eq 500
      - name: Audit 500 and selectively review flags plus 10 controls
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRIVIA_REVIEW_USAGE_LOG: ${{ runner.temp }}/trivia-qwen500/review-usage.jsonl
          TRIVIA_REVIEW_SPEND_LIMIT_USD: '0.35'
        run: |
          set -euo pipefail
          python3 tools_local/trivia/qwen_500_experiment.py audit \
            --source "$RUNNER_TEMP/trivia-qwen500/source-en.jsonl" \
            --drafts "$RUNNER_TEMP/trivia-qwen500/qwen-500-drafts.jsonl" \
            --edited "$RUNNER_TEMP/trivia-qwen500/qwen-500-ai-edited.jsonl" \
            --report "$RUNNER_TEMP/trivia-qwen500/qwen-500-audit.jsonl" \
            --summary "$RUNNER_TEMP/trivia-qwen500/qwen-500-summary.json" \
            --translation-ledger "$RUNNER_TEMP/trivia-qwen500/translation-usage.jsonl" \
            --review-ledger "$RUNNER_TEMP/trivia-qwen500/review-usage.jsonl"
      - name: Save translations, spending ledgers and reports; never publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivia-qwen-500-unapproved-audit
          path: |
            ${{ runner.temp }}/trivia-qwen500/qwen-500-drafts.jsonl
            ${{ runner.temp }}/trivia-qwen500/qwen-500-ai-edited.jsonl
            ${{ runner.temp }}/trivia-qwen500/qwen-500-audit.jsonl
            ${{ runner.temp }}/trivia-qwen500/qwen-500-summary.json
            ${{ runner.temp }}/trivia-qwen500/translation-usage.jsonl
            ${{ runner.temp }}/trivia-qwen500/review-usage.jsonl
          if-no-files-found: ignore
          retention-days: 14
