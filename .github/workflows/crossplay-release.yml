# Turn a v* tag into a release the devices' own updaters can install.
#
# Upstream's release.yml is still in this tree and still fires on every tag, but
# it builds gh_release, which is -DFREEINK_DEVICE_X4/X3 and therefore ESP32-C3.
# This fork's devices (X4 Pro, Sticky) are S3. Two workflows on one tag would
# publish two binaries and let the updater pick the wrong chip, so upstream's is
# filtered to tags this fork never creates (see the `if` below) and this one
# owns v*.
#
# The stable X4 Pro updater continues to receive the literal firmware.bin.
# The experimental USB passkey variant is published as a separate asset and
# therefore cannot replace normal firmware by accident.
name: CrossPlay release

on:
  push:
    tags:
      - "v*"
  # Dispatched by crossplay-autorelease.yml on the tag it just pushed, because
  # a tag pushed with the workflow token starts nothing on its own.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crossplay-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PIO_CORE_URL: https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, for host-tests/release below: without them its notes gate
          # cannot see what the previous tag published and skips itself.
          fetch-depth: 0

      - name: The tag must be the version being built
        run: |
          VERSION=$(awk '/^\[crossplay\]/{f=1;next} /^\[/{f=0} f && /^version *=/{print $3; exit}' platformio.ini)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match [crossplay] version ${VERSION}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches [crossplay] version ${VERSION}"

      - name: The release notes must be this release's
        run: bash host-tests/release/run.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-release-${{ hashFiles('platformio.ini', 'platformio.passkey.ini', 'tools_local/build_passkey.sh') }}

      - name: Install PlatformIO Core and tooling
        run: uv pip install --system -U "$PIO_CORE_URL" esptool

      - name: Build normal X4 Pro release firmware
        run: python3 -m platformio run -e gh_release_x4pro

      - name: Build experimental USB passkey firmware
        run: bash tools_local/build_passkey.sh

      - name: Name X4 Pro artefacts
        run: |
          set -euo pipefail
          mkdir -p dist

          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     .pio/build/gh_release_x4pro/bootloader.bin \
            0x8000  .pio/build/gh_release_x4pro/partitions.bin \
            0x10000 .pio/build/gh_release_x4pro/firmware.bin

          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     .pio/build/x4pro_passkey/bootloader.bin \
            0x8000  .pio/build/x4pro_passkey/partitions.bin \
            0x10000 .pio/build/x4pro_passkey/firmware.bin

          cp .pio/build/gh_release_x4pro/firmware.bin dist/firmware.bin
          cp .pio/build/x4pro_passkey/firmware.bin dist/firmware-passkey.bin
          cp .pio/build/gh_release_x4pro/firmware.elf \
             "dist/crossplay-${GITHUB_REF_NAME}-x4pro.elf"
          cp .pio/build/x4pro_passkey/firmware.elf \
             "dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey.elf"

      - name: List artefacts
        run: ls -la dist

      - name: The merged images really are merged
        run: |
          fail=0
          for full in \
            "dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin" \
            "dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey-full.bin"; do
            check() {
              got=$(dd if="$full" bs=1 skip=$1 count=2 2>/dev/null | xxd -p)
              if [ "$got" != "$2" ]; then
                echo "::error::$full at $(printf '0x%x' $1): expected $2 ($3), got $got"
                fail=1
              else
                echo "  $(printf '0x%-7x' $1) $got  $3  ($full)"
              fi
            }
            check 0     e903 "bootloader"
            check 32768 aa50 "partition table"
            check 65536 e907 "app"
          done
          exit $fail

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          body: |
            CrossPlay release for **Xteink X4 Pro**.

            ### What is new in 1.12.25

            - Adds an **experimental USB passkey / FIDO2 build** for X4 Pro.
            - Adds CTAP-HID transport, FIDO HID framing, `INIT`, `PING` and CTAP2 handling.
            - Adds P-256 / ES256 crypto primitives and an AES-256-GCM encrypted credential vault.
            - Adds physical user-presence confirmation on the device.
            - Keeps the normal X4 Pro firmware and OTA asset completely separate from the passkey build.
            - Normal devices continue to use `firmware.bin`; the passkey variant uses `firmware-passkey.bin`.

            **Security note:** the passkey variant is experimental. Its vault root key is still stored in
            normal NVS; hardware-backed eFuse/HMAC provisioning is not enabled automatically. Treat the
            passkey image as a test build, not as a production hardware security key.

            PLAY NEARBY games remain: Chess, Checkers, Connect Four, Yahtzee,
            Knucklebones, Battleship, Jaipur, Sea Salt and Toy Battle.

            ### Install

            - Normal USB full image: `crossplay-<version>-x4pro-full.bin`
            - Normal OTA app image: `firmware.bin`
            - Experimental passkey full image: `crossplay-<version>-x4pro-passkey-full.bin`
            - Experimental passkey OTA image: `firmware-passkey.bin`

      - name: Tell the board a release went out
        if: vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -sS -o /dev/null -w "events: %{http_code}\n" -X POST "$SUPABASE_URL/rest/v1/events" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"service\":\"release\",\"event\":\"release\",\"version\":\"${GITHUB_REF_NAME#v}\",\"props\":{\"tag\":\"$GITHUB_REF_NAME\"}}" || true
