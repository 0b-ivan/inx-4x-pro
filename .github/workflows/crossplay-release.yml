# Build and publish the X4 Pro / Sticky CrossPlay release.
#
# Two entry points are supported:
#   1. a strict vX.Y.Z tag (legacy/manual path), or
#   2. an exact `release: vX.Y.Z` commit on the integration/main branch.
#
# The second path lets the release be completed from repository changes alone:
# bump [crossplay].version, update the notes below, commit with `release: vX.Y.Z`,
# and this workflow builds, validates and creates the matching GitHub release/tag.
name: CrossPlay release

on:
  push:
    tags:
      - "v*"
    branches:
      - feature/crossplay-games
      - main

permissions:
  contents: write

jobs:
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # freeink-sdk is vendored in this fork. A stale open-x4-sdk gitlink has
          # no .gitmodules URL, so recursive submodule checkout fails before the
          # release can even run.
          submodules: false
          # host-tests/release compares these notes with the previous SemVer tag.
          fetch-depth: 0

      - name: Resolve and validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk '/^\[crossplay\]/{f=1;next} /^\[/{f=0} f && /^version *=/{print $3; exit}' platformio.ini)
          TAG="v${VERSION}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
              echo "tag ${GITHUB_REF_NAME} does not match [crossplay] version ${VERSION}" >&2
              exit 1
            fi
          else
            EXPECTED="release: ${TAG}"
            ACTUAL="${{ github.event.head_commit.message }}"
            if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
              echo "release commit must be exactly '${EXPECTED}', got '${ACTUAL}'" >&2
              exit 1
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "CrossPlay release identity: ${TAG} @ ${GITHUB_SHA}"

      - name: The release notes must be this release's
        run: bash host-tests/release/run.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-release-${{ hashFiles('platformio.ini') }}

      - name: Install release toolchain
        run: pip install --upgrade platformio esptool

      - name: Build x4pro
        run: pio run -e gh_release_x4pro

      - name: Build sticky
        run: pio run -e gh_release_sticky

      - name: Name the x4pro artefacts
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${RELEASE_TAG}-x4pro-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     .pio/build/gh_release_x4pro/bootloader.bin \
            0x8000  .pio/build/gh_release_x4pro/partitions.bin \
            0x10000 .pio/build/gh_release_x4pro/firmware.bin
          cp .pio/build/gh_release_x4pro/firmware.bin dist/firmware.bin
          cp .pio/build/gh_release_x4pro/firmware.elf \
             "dist/crossplay-${RELEASE_TAG}-x4pro.elf"

      - name: Name the sticky artefacts
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${RELEASE_TAG}-sticky-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     .pio/build/gh_release_sticky/bootloader.bin \
            0x8000  .pio/build/gh_release_sticky/partitions.bin \
            0x10000 .pio/build/gh_release_sticky/firmware.bin
          cp .pio/build/gh_release_sticky/firmware.bin dist/firmware-sticky.bin
          cp .pio/build/gh_release_sticky/firmware.elf \
             "dist/crossplay-${RELEASE_TAG}-sticky.elf"
          ls -la dist

      - name: Validate OTA application images
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          slot_size = 0x007F0000
          ota_url = b'https://api.github.com/repos/0b-ivan/inx-4x-pro/releases/latest'
          version_text = os.environ['RELEASE_VERSION']
          version = version_text.encode()

          for filename, board in (
              ('dist/firmware.bin', 'x4pro'),
              ('dist/firmware-sticky.bin', 'sticky'),
          ):
              data = Path(filename).read_bytes()
              if not data or data[0] != 0xE9:
                  raise SystemExit(f'{filename}: invalid ESP app magic')
              chip_id = int.from_bytes(data[12:14], 'little')
              if chip_id != 9:
                  raise SystemExit(f'{filename}: chip id {chip_id}, expected ESP32-S3 (9)')
              if len(data) > slot_size:
                  raise SystemExit(f'{filename}: {len(data)} exceeds OTA slot {slot_size}')
              if f'CROSSPOINT-BOARD-V1:{board};'.encode() not in data:
                  raise SystemExit(f'{filename}: missing {board} board tag')
              if ota_url not in data:
                  raise SystemExit(f'{filename}: wrong OTA repository endpoint')
              if version not in data:
                  raise SystemExit(f'{filename}: wrong CrossPlay version, expected {version_text}')
              print(f'{filename}: OK size={len(data)} board={board} version={version_text}')
          PY
          sha256sum dist/firmware.bin dist/firmware-sticky.bin

      - name: The merged images really are merged
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          fail=0
          for full in "dist/crossplay-${RELEASE_TAG}-x4pro-full.bin" \
                      "dist/crossplay-${RELEASE_TAG}-sticky-full.bin"; do
            check() {
              got=$(dd if="$full" bs=1 skip=$1 count=2 2>/dev/null | xxd -p)
              if [ "$got" != "$2" ]; then
                echo "::error::$full at $(printf '0x%x' $1): expected $2 ($3), got $got"
                fail=1
              else
                echo "$(printf '0x%-7x' $1) $got $3 ($full)"
              fi
            }
            check 0     e903 "bootloader"
            check 32768 aa50 "partition table"
            check 65536 e907 "app"
          done
          exit $fail

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CrossPlay ${{ steps.release.outputs.tag }}
          make_latest: true
          files: dist/*
          generate_release_notes: false
          body: |
            CrossPlay for the **Xteink X4 Pro** and **Seeed reTerminal Sticky**.

            ### What is new in 1.12.10

            **Wake-up on the X4 Pro is immediate and available from Home.** A short
            press of the physical standby/power button on GPIO3 is sufficient to
            wake from deep sleep; there is no wake hold timer on this board.

            **The capacitive Home pad can now wake the reader.** The X4 Pro keeps
            its GT911 touch rail (GPIO2, active-low) powered while asleep and arms
            GT911 INT on GPIO10 together with the power button as an ESP32-S3 EXT1
            active-low wake source.

            The Home pad and the screen share that one GT911 interrupt line, so a
            normal panel touch can also wake the ESP. Once awake, InputManager still
            distinguishes the Home-key status bit from ordinary touch coordinates.

            Sticky and every non-X4-Pro board keep the previous low-drain sleep and
            power-button wake behaviour.

            `firmware.bin` is the X4 Pro application-only OTA image;
            `firmware-sticky.bin` is the Sticky OTA image. The `-full.bin` files are
            separate USB installation images containing bootloader, partition table
            and application.
