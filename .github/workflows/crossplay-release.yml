# Turn a v* tag into the one stable release both X4 Pro firmware variants use.
# Normal devices request firmware.bin; USB-passkey devices request
# firmware-passkey.bin. Keeping both assets on the same GitHub release means
# /releases/latest can never let one variant shadow the other.
name: CrossPlay release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crossplay-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PIO_CORE_URL: https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

jobs:
  release:
    # Old experimental *-passkey tags are deliberately not release channels.
    # Passkey and normal firmware now ship under the same stable SemVer tag.
    if: ${{ !endsWith(github.ref_name, '-passkey') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag must be the version being built
        run: |
          VERSION=$(awk '/^\[crossplay\]/{f=1;next} /^\[/{f=0} f && /^version *=/{print $3; exit}' platformio.ini)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match [crossplay] version ${VERSION}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches [crossplay] version ${VERSION}"

      - name: The release notes must be this release's
        run: bash host-tests/release/run.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-release-${{ hashFiles('platformio.ini', 'platformio.passkey.ini') }}

      - name: Install PlatformIO Core and tooling
        run: uv pip install --system -U "$PIO_CORE_URL" esptool

      - name: Build normal release firmware
        run: python3 -m platformio run -e gh_release_x4pro

      - name: Build USB passkey release firmware
        run: python3 -m platformio run --project-conf platformio.passkey.ini -e x4pro_passkey

      - name: Name the x4pro artefacts
        run: |
          set -euo pipefail
          mkdir -p dist

          NORMAL=.pio/build/gh_release_x4pro
          PASSKEY=.pio/build/x4pro_passkey

          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     "$NORMAL/bootloader.bin" \
            0x8000  "$NORMAL/partitions.bin" \
            0x10000 "$NORMAL/firmware.bin"
          cp "$NORMAL/firmware.bin" dist/firmware.bin
          cp "$NORMAL/firmware.elf" "dist/crossplay-${GITHUB_REF_NAME}-x4pro.elf"

          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     "$PASSKEY/bootloader.bin" \
            0x8000  "$PASSKEY/partitions.bin" \
            0x10000 "$PASSKEY/firmware.bin"
          cp "$PASSKEY/firmware.bin" dist/firmware-passkey.bin
          cp "$PASSKEY/firmware.elf" "dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey.elf"

      - name: Validate artefacts
        run: |
          set -euo pipefail
          test -s dist/firmware.bin
          test -s dist/firmware-passkey.bin
          fail=0
          for full in \
            "dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin" \
            "dist/crossplay-${GITHUB_REF_NAME}-x4pro-passkey-full.bin"; do
            check() {
              got=$(dd if="$full" bs=1 skip=$1 count=2 2>/dev/null | xxd -p)
              if [ "$got" != "$2" ]; then
                echo "::error::$full at $(printf '0x%x' $1): expected $2 ($3), got $got"
                fail=1
              else
                echo "  $(printf '0x%-7x' $1) $got  $3  ($full)"
              fi
            }
            check 0     e903 "bootloader"
            check 32768 aa50 "partition table"
            check 65536 e907 "app"
          done
          python -m esptool image-info dist/firmware.bin | tee /tmp/normal-image-info.txt
          python -m esptool image-info dist/firmware-passkey.bin | tee /tmp/passkey-image-info.txt
          grep -qi "ESP32-S3\|ESP32S3" /tmp/normal-image-info.txt
          grep -qi "ESP32-S3\|ESP32S3" /tmp/passkey-image-info.txt
          exit $fail

      - name: List artefacts
        run: ls -la dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          body: |
            CrossPlay release for **Xteink X4 Pro**.

            ### Install

            Normal CrossPlay:
            - USB full image: `crossplay-<version>-x4pro-full.bin`
            - OTA app image: `firmware.bin`

            USB Passkey variant:
            - USB full image: `crossplay-<version>-x4pro-passkey-full.bin`
            - OTA app image: `firmware-passkey.bin`

            The two OTA asset names are intentionally distinct. Normal X4 Pro
            devices cannot switch to the passkey USB personality through OTA.

            ### Passkey security status

            The credential vault uses AES-256-GCM, but its root key is still
            stored in ordinary NVS. The passkey variant is therefore not
            hardware-backed and does not burn or modify eFuses.

      - name: Tell the board a release went out
        if: vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -sS -o /dev/null -w "events: %{http_code}\n" -X POST "$SUPABASE_URL/rest/v1/events" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"service\":\"release\",\"event\":\"release\",\"version\":\"${GITHUB_REF_NAME#v}\",\"props\":{\"tag\":\"$GITHUB_REF_NAME\"}}" || true
