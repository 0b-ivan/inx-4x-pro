# CrossPlay's own CI.
#
# main is the canonical development and release branch for this fork.
# Keep the device builds, release builds, simulator and host suites green there.
name: CrossPlay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # freeink-sdk is vendored as a normal tree in this fork. Do not recurse
          # into stale/orphan gitlinks during checkout.
          submodules: false
          # Tags are required by host-tests/release to compare release notes.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install the simulator's host libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libssl-dev

      - name: Build the x4pro firmware
        run: PLATFORMIO_BUILD_FLAGS="-fstack-usage -fcallgraph-info=su" pio run -e x4pro

      - name: Stack fits its task (x4pro)
        run: python3 scripts_local/stack_budget.py --build-dir .pio/build/x4pro

      - name: Build the sticky firmware
        run: PLATFORMIO_BUILD_FLAGS="-fstack-usage -fcallgraph-info=su" pio run -e sticky

      - name: Stack fits its task (sticky)
        run: python3 scripts_local/stack_budget.py --build-dir .pio/build/sticky

      - name: Build the simulator
        run: pio run -e simulator_x4_pro

      - name: Build the release firmware (x4pro)
        run: pio run -e gh_release_x4pro

      - name: Build the release firmware (sticky)
        run: pio run -e gh_release_sticky

      - name: Host tests
        run: |
          for suite in host-tests/*/run.sh; do
            bash "$suite"
          done
