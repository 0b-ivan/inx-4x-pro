# CrossPlay's fast development CI.
#
# Stable release binaries are built by crossplay-release.yml; guarded nightlies by this CI.
# The release train is X4 Pro-only. Sticky remains a local development target
# in platformio.ini, but does not gate main or tagged X4 Pro releases.
name: CrossPlay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: "Publish an X4 Pro OTA prerelease after all CI jobs pass"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: crossplay-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIO_CORE_URL: https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

jobs:
  firmware:
    name: firmware (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [x4pro]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install PlatformIO Core and dependencies
        run: |
          uv pip install --system -U "$PIO_CORE_URL"
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-packages-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio.sim.ini') }}

      # Stack analysis needs the compiler side outputs (.su/.ci) for every
      # translation unit. PlatformIO's normal build cache restores .o files but
      # not those side outputs, which produces a partial call graph and false
      # "entry not in the graph" failures. Build once against an empty,
      # throwaway cache so the firmware and its stack graph are complete.
      - name: Build firmware
        run: |
          set -euo pipefail
          STACK_CACHE="$RUNNER_TEMP/pio-stack-cache-${{ matrix.environment }}"
          rm -rf "$STACK_CACHE" ".pio/build/${{ matrix.environment }}"
          mkdir -p "$STACK_CACHE"
          PLATFORMIO_BUILD_CACHE_DIR="$STACK_CACHE" \
          PLATFORMIO_BUILD_FLAGS="-fstack-usage -fcallgraph-info=su" \
            python3 -m platformio run -e "${{ matrix.environment }}"

      - name: Stack fits its task
        run: python3 scripts_local/stack_budget.py --build-dir ".pio/build/${{ matrix.environment }}"

      # A downloadable *application-only* firmware for physical PR testing.
      # Not a GitHub Release and not advertised through the device OTA updater.
      - name: Package verified X4 Pro PR test firmware
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APP=".pio/build/${{ matrix.environment }}/firmware.bin"
          test -s "$APP"
          MAGIC="$(head -c 1 "$APP" | od -An -tx1 | tr -d '[:space:]')"
          test "$MAGIC" = "e9"
          grep -aFq 'CROSSPOINT-BOARD-V1:x4pro;' "$APP"
          mkdir -p dist/pr-test
          cp "$APP" dist/pr-test/firmware.bin
          (cd dist/pr-test && sha256sum firmware.bin > firmware.bin.sha256)
          printf 'PR source commit: %s\nCI merge commit: %s\nPlatformIO environment: %s\nImage: ESP32-S3 X4 Pro application only\nInstall using Developer Mode; not a full-flash image or a public OTA release.\n' \
            "${{ github.event.pull_request.head.sha }}" "$GITHUB_SHA" "${{ matrix.environment }}" > dist/pr-test/BUILD-INFO.txt

      - name: Upload X4 Pro PR firmware for device testing
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: x4pro-pr-test-${{ github.event.pull_request.head.sha }}
          path: dist/pr-test/
          if-no-files-found: error
          retention-days: 7

  simulator:
    name: simulator (x4 pro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install PlatformIO Core and dependencies
        run: |
          uv pip install --system -U "$PIO_CORE_URL"
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-packages-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio.sim.ini') }}

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: pio-build-${{ runner.os }}-simulator_x4_pro-${{ github.sha }}
          restore-keys: |
            pio-build-${{ runner.os }}-simulator_x4_pro-

      - name: Install simulator host libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libssl-dev libwolfssl-dev libmbedtls-dev xvfb xauth

      - name: Build simulator
        run: python3 -m platformio run -e simulator_x4_pro

      - name: Biscuit app UI smoke (headless X4 Pro)
        run: bash scripts_local/biscuit_sim_smoke.sh

      - name: Verify real SDL screenshot visual goldens
        run: python3 host-tests/biscuit-sim/test_visual_goldens.py .pio/biscuit-ui-smoke

      - name: AWS Trivia study/review touch smoke (synthetic SD pack)
        run: bash scripts_local/trivia_aws_sim_smoke.sh

      - name: AWS Trivia study reader UX smoke (paging, hold glossary, no swipe grading)
        run: bash scripts_local/trivia_aws_sim_ux.sh

      - name: Upload AWS study simulator captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-study-simulator-debug
          path: |
            .pio/aws-study-ui-smoke/
            .pio/aws-study-ux-smoke/
          if-no-files-found: ignore

      - name: Upload Biscuit UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biscuit-simulator-smoke
          path: .pio/biscuit-ui-smoke/
          if-no-files-found: ignore

  host-tests:
    name: host tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          # host-tests/release compares against the previous SemVer tag.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U "$PIO_CORE_URL"

      - name: Install player host libraries
        run: sudo apt-get update && sudo apt-get install -y libwolfssl-dev

      - name: Host tests
        run: |
          set -euo pipefail
          for suite in host-tests/*/run.sh; do
            bash "$suite"
          done

      - name: Upload Biscuit native bitmap previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biscuit-native-previews
          path: .pio/biscuit-native-previews/
          if-no-files-found: ignore


  # One-time September prototype release cleanup: only the eight explicitly
  # enumerated old alphas, and never stable, SD data or active study firmware.
  # Runs independently so release hygiene does not wait for a full OTA compile.
  release-legacy-cleanup:
    name: One-time legacy alpha release cleanup
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 44 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Test strict release retention allowlist
        shell: bash
        run: python3 -m unittest discover -s host-tests/release -p 'test_release_retention.py' -v

      - name: Remove superseded September test alphas (keep stable and data)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts_local/release_retention.py \
            --repository "$GITHUB_REPOSITORY" \
            --protect-tag v1.16.13-rc.20261027.ga3f90d4f \
            --keep-study 3 --keep-connect-four 2 \
            --min-age-hours 4 --prune-legacy-alpha --apply

  # Explicit user-requested PUBLIC feature-test Nightly. This job cannot
  # publish unless firmware, simulator and all host regressions pass for PR #44.
  # Published packs are ORIGINAL DEMO fixtures, never private Udemy questions.
  study-nightly-release:
    name: X4 Pro public study-feature Nightly OTA
    needs: [firmware, simulator, host-tests]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 44 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Compute tested public Nightly tag
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(awk '/^\[crossplay\]/{f=1;next} /^\[/{f=0} f && /^version *=/{print $3;exit}' platformio.ini)"
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          SHORT_SHA="${SOURCE_SHA:0:8}"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))-rc.$(date -u +%Y%m%d).g$SHORT_SHA"
          echo "CROSSPLAY_NIGHTLY_VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "NIGHTLY_TAG=v$NEXT" >> "$GITHUB_ENV"

      - name: Install validated X4 Pro release toolchain
        shell: bash
        run: |
          uv pip install --system -U "$PIO_CORE_URL" esptool
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" \
            "bitstring>=4.3.1" "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" \
            "esp-coredump>=1.14.0"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-study-nightly-${{ hashFiles('platformio.ini') }}

      - name: Build OTA-safe X4 Pro Nightly image
        run: python3 -m platformio run -e gh_nightly_x4pro

      - name: Check board identity, version, checksum
        shell: bash
        run: |
          set -euo pipefail
          APP=".pio/build/gh_nightly_x4pro/firmware.bin"
          test -s "$APP"
          python3 -m esptool image-info "$APP" > /tmp/study-ota-image.txt
          grep -Eq 'ESP32-S3|Chip ID: 9' /tmp/study-ota-image.txt
          grep -aFq 'CROSSPOINT-BOARD-V1:x4pro;' "$APP"
          grep -aFq "$CROSSPLAY_NIGHTLY_VERSION" "$APP"
          mkdir -p dist
          cp "$APP" dist/firmware.bin
          (cd dist && sha256sum firmware.bin > firmware.bin.sha256)
          cat > dist/notes.md <<EOF
          Public **Xteink X4 Pro Nightly OTA**, tested feature branch at \`$SOURCE_SHA\`.

          Version: \`$CROSSPLAY_NIGHTLY_VERSION\`. This firmware adds
          certification study packs, Github download and local selection.
          Navigate **Trivia > Study Packs > GITHUB** for free synthetic
          DOP-C02-DEMO / SAA-C03-DEMO packs, or copy your private
          DOP-C02.dat into \`/trivia/aws/\` on your SD card.

          DEMO question files are expressly non-exam, original test fixtures.
          No paid Udemy content is included in this public release.
          X4 Pro application image only; no repartitioning or full-flash binary.
          Keep a recovery copy before installing via OTA Nightly/Pre-release.
          EOF

      - name: Publish public firmware Nightly
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Nightly already exists; keeping immutable."
          else
            gh release create "$NIGHTLY_TAG" dist/firmware.bin dist/firmware.bin.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "X4 Pro Nightly Study $NIGHTLY_TAG" --prerelease \
              --notes-file dist/notes.md
          fi

      - name: Generate public original demo packs and catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 tools_local/trivia/make_public_demo_packs.py --out "$RUNNER_TEMP/study-public"
          ls -lh "$RUNNER_TEMP/study-public"

      - name: Publish public GitHub study catalog
        shell: bash
        run: |
          set -euo pipefail
          PACKS="$RUNNER_TEMP/study-public"
          if ! gh release view trivia-study-packs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create trivia-study-packs \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "CrossPlay Public Study DEMO Packs" --prerelease \
              --notes "Original demo questions only. No paid or licensed exam-bank content."
          fi
          gh release upload trivia-study-packs \
            "$PACKS/catalog.txt" "$PACKS/README.txt" \
            "$PACKS/DOP-C02-DEMO.dat" "$PACKS/DOP-C02-DEMO.topics" \
            "$PACKS/SAA-C03-DEMO.dat" "$PACKS/SAA-C03-DEMO.topics" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify Nightly retention policy
        shell: bash
        run: python3 -m unittest discover -s host-tests/release -p 'test_release_retention.py' -v

      - name: Prune superseded feature Nightlies (stable and data releases excluded)
        shell: bash
        run: |
          set -euo pipefail
          # Delete only verified old feature prereleases after this exact new
          # build has passed and the new tag is publicly available.
          python3 scripts_local/release_retention.py \
            --repository "$GITHUB_REPOSITORY" \
            --protect-tag "$NIGHTLY_TAG" \
            --keep-study 3 --keep-connect-four 2 \
            --min-age-hours 4 --prune-legacy-alpha --apply

  # Manual prerelease on main only, gated by the same three CI jobs.
  # Never publish prereleases from pull requests or old feature branches.
  nightly-release:
    name: X4 Pro Nightly OTA prerelease
    needs: [firmware, simulator, host-tests]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_nightly == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Compute immutable prerelease version from tested main commit
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(awk '/^\[crossplay\]/{f=1;next} /^\[/{f=0} f && /^version *=/{print $3; exit}' platformio.ini)"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected stable CrossPlay version: $BASE_VERSION"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          TEST_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))-rc.$(date -u +%Y%m%d).g${SHORT_SHA}"
          echo "CROSSPLAY_NIGHTLY_VERSION=$TEST_VERSION" >> "$GITHUB_ENV"
          echo "NIGHTLY_TAG=v$TEST_VERSION" >> "$GITHUB_ENV"
          echo "Nightly: v$TEST_VERSION from $GITHUB_SHA"

      - name: Install firmware build toolchain
        run: |
          uv pip install --system -U "$PIO_CORE_URL" esptool
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-nightly-${{ hashFiles('platformio.ini') }}

      - name: Build X4 Pro OTA-only firmware
        run: python3 -m platformio run -e gh_nightly_x4pro

      - name: Validate ESP32-S3 board image and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          APP=".pio/build/gh_nightly_x4pro/firmware.bin"
          ELF=".pio/build/gh_nightly_x4pro/firmware.elf"
          test -s "$APP"
          test -s "$ELF"
          python3 -m esptool image-info "$APP" | tee /tmp/x4pro-image-info.txt
          grep -Eq 'ESP32-S3|Chip ID: 9' /tmp/x4pro-image-info.txt
          # Search binary directly: grep -q with a pipe can cause SIGPIPE under pipefail.
          grep -aFq 'CROSSPOINT-BOARD-V1:x4pro;' "$APP"
          grep -aFq "$CROSSPLAY_NIGHTLY_VERSION" "$APP"
          mkdir -p dist
          cp "$APP" dist/firmware.bin
          cp "$ELF" "dist/crossplay-${NIGHTLY_TAG}-x4pro.elf"
          (cd dist && sha256sum firmware.bin > firmware.bin.sha256)
          cat > dist/release-notes.md <<EOF
          X4 Pro **Nightly OTA test build** from \`main\`.

          Source commit: \`${GITHUB_SHA}\`

          Passed gates: X4 Pro firmware build, native host tests, headless SDL Biscuit Activity smoke tests and visual regression.

          This prerelease contains the tested X4 Pro main-branch firmware. The simulator's FIRE preview is UI-only; hardware builds contain the normal hardware Activity code. Use wireless features only on owned/authorized test equipment.

          **Installation:** On the X4 Pro open OTA Updates, select **Nightly / Pre-release**, then select \`${NIGHTLY_TAG}\` and confirm. The device verifies chip, board and image size. Keep a recovery backup available.

          This is a **pre-release**, not the stable/latest OTA version. Only the application image \`firmware.bin\` is provided; no full-flash image or partition table is included.
          EOF

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $NIGHTLY_TAG already exists; not overwriting."
            exit 0
          fi
          gh release create "$NIGHTLY_TAG" \
            dist/firmware.bin \
            dist/firmware.bin.sha256 \
            "dist/crossplay-${NIGHTLY_TAG}-x4pro.elf" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "X4 Pro Nightly ${NIGHTLY_TAG}" \
            --prerelease \
            --notes-file dist/release-notes.md

  # One-shot, manual and branch-scoped: never runs on pushes or pull requests.
  # On mobile: Actions > CrossPlay > Run workflow > fix/i18n-translation-quality-audit.
  # The user must first set OPENROUTER_API_KEY in Actions repository secrets.
  trivia-german-pilot:
    name: German quiz translation pilot (20 questions)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == '0b-ivan/inx-4x-pro' &&
      github.ref == 'refs/heads/fix/i18n-translation-quality-audit' &&
      inputs.publish_nightly != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Require a temporary OpenRouter repository secret
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::Set a NEW temporary OPENROUTER_API_KEY Actions secret; do not paste a key in a chat or workflow file."
            exit 1
          fi

      - name: Download and verify the published English question pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivia-pilot"
          curl -fsSL --retry 3 \
            'https://github.com/ma-r-s/crossplay/releases/download/trivia-pack/pack.dat' \
            -o "$RUNNER_TEMP/trivia-pilot/pack.dat"
          echo 'a17435136122ce1d2485d4c4c30e58206e6dffc88b819e0d4c646081b485f9cf  '"$RUNNER_TEMP/trivia-pilot/pack.dat" | sha256sum --check
          python3 tools_local/trivia/export_pack.py \
            --pack "$RUNNER_TEMP/trivia-pilot/pack.dat" \
            --out "$RUNNER_TEMP/trivia-pilot/questions-en.jsonl"

      - name: Translate at most 20 questions (UNREVIEWED drafts)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools_local/trivia/translate_de_pack.py \
            --src "$RUNNER_TEMP/trivia-pilot/questions-en.jsonl" \
            --out "$RUNNER_TEMP/trivia-pilot/questions-de-draft.jsonl" \
            --model "anthropic/claude-sonnet-4.6" --limit 20

      - name: Upload draft translations for manual quality review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivia-german-pilot-unreviewed
          path: ${{ runner.temp }}/trivia-pilot/questions-de-draft.jsonl
          if-no-files-found: ignore
          retention-days: 1
