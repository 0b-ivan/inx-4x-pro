name: Compile X4 Pro Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: x4pro-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-x4pro

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Validate safety scripts
        run: |
          python -m py_compile scripts/x4pro_inspect.py
          python -m py_compile scripts/refuse_x4pro_upload.py

      - name: Build X4 Pro application
        run: pio run -e gh_release

      - name: Validate application artifact
        run: |
          python - <<'PY'
          from pathlib import Path

          firmware = Path('.pio/build/gh_release/firmware.bin')
          if not firmware.is_file():
              raise SystemExit('firmware.bin missing')

          size = firmware.stat().st_size
          limit = 0x640000
          print(f'firmware.bin: {size} bytes; conservative limit: {limit} bytes')
          if size > limit:
              raise SystemExit('firmware.bin exceeds conservative OTA slot limit')
          PY

      # SAFETY: never publish bootloader.bin or partitions.bin for the port.
      # First-device testing must preserve the live factory boot region and write
      # only firmware.bin to a validated inactive OTA application slot.
      - name: Upload application-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Inx-X4Pro-${{ github.ref_name }}-APP-ONLY
          path: |
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
          if-no-files-found: error

      # GitHub OTA updater consumes the latest release and looks for this
      # exact asset name. The first X4-Pro release is intentionally alpha.
      - name: Publish GitHub alpha release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          name: Inx X4 Pro ${{ github.ref_name }} (ALPHA)
          body: |
            **ALPHA – X4 Pro experimental firmware**

            Application-only OTA image. Do not flash bootloader or partition files.
          files: .pio/build/gh_release/firmware.bin
