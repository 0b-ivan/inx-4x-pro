name: Compile X4 Pro Release

on:
  push:
    tags:
      - '*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-x4pro

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build X4 Pro application
        run: pio run -e gh_release

      # SAFETY: never publish bootloader.bin or partitions.bin for the port.
      # The first hardware-test procedure must preserve the live factory boot
      # region and write only firmware.bin to a validated inactive OTA app slot.
      - name: Upload application-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Inx-X4Pro-${{ github.ref_name }}-APP-ONLY
          path: |
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
          if-no-files-found: error
