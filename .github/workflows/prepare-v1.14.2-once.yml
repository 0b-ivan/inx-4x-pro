name: Prepare v1.14.2 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-v1.14.2-once.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Guard and prepare release version
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.14.2 >/dev/null 2>&1; then
            echo "v1.14.2 already exists; refusing to move or replace it." >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          ini = Path('platformio.ini')
          text = ini.read_text()
          pattern = r'(\[crossplay\]\nversion\s*=\s*)1\.14\.1'
          text, count = re.subn(pattern, r'\g<1>1.14.2', text, count=1)
          if count != 1:
              raise SystemExit('expected [crossplay] version 1.14.1 exactly once')
          ini.write_text(text)
          PY

      - name: Validate release contract
        run: bash host-tests/release/run.sh

      - name: Commit prepared stable version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platformio.ini
          git commit -m "chore: prepare v1.14.2"
          git push origin HEAD:main
