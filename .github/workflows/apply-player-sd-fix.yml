name: Apply player SD SQLite fix

on:
  push:
    branches:
      - feature/player-system
    paths:
      - .github/scripts/apply_player_sd_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/player-system
          fetch-depth: 0

      - name: Apply hardware storage fix
        run: python3 .github/scripts/apply_player_sd_fix.py

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "Ob-Ivan"
          git config user.email "55740240+0b-ivan@users.noreply.github.com"
          git rm .github/scripts/apply_player_sd_fix.py .github/workflows/apply-player-sd-fix.yml
          git add -A
          git commit -m "fix(player): harden SD SQLite runtime"
          git push origin HEAD:feature/player-system
