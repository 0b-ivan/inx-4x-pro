name: TOTP vault fixup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/totp-vault-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply encrypted vault patch
        run: python3 scripts_local/totp_vault_fix.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps_local/totp/TotpActivity.h src/apps_local/totp/TotpActivity.cpp
          git commit -m "feat: encrypt authenticator vault behind a PIN"
          git push origin HEAD:main
