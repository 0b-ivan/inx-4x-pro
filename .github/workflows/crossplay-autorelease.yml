# Release a prepared CrossPlay version only after the exact main commit passed
# the complete CrossPlay CI. Normal commits at an already-tagged version do
# nothing.
name: CrossPlay autorelease

on:
  workflow_run:
    workflows: ["CrossPlay"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: crossplay-autorelease
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Release green prepared version
        run: |
          set -euo pipefail
          git fetch origin main --tags

          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$PASSED_SHA" ]; then
            echo "CI passed $PASSED_SHA, but main is now $CURRENT_MAIN; newer CI owns the release decision."
            exit 0
          fi

          VERSION="$(awk '/^\[crossplay\]/{f=1;next} /^\[/{f=0} f && /^version *=/{print $3; exit}' platformio.ini)"
          test -n "$VERSION"
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to release."
            exit 0
          fi

          grep -Fq "### What is new in ${VERSION}" .github/workflows/crossplay-release.yml || {
            echo "Release notes are not prepared for ${VERSION}." >&2
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$PASSED_SHA"
          git push origin "$TAG"

          # A tag pushed by GITHUB_TOKEN does not start another workflow, so
          # dispatch the release workflow explicitly on the immutable tag.
          gh workflow run crossplay-release.yml --ref "$TAG"
