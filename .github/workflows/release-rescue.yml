name: Release rescue

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-rescue.yml

permissions:
  contents: write
  actions: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release files
        run: python3 scripts_local/release_rescue.py

      - name: Commit and tag v1.12.18
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare v1.12.18 tarot orientation hotfix"
          git push origin HEAD:main
          git tag -a v1.12.18 -m "v1.12.18"
          git push origin v1.12.18

      - name: Dispatch release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run crossplay-release.yml --ref v1.12.18
