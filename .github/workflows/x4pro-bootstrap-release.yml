name: Publish X4 Pro Bootstrap Pre-Release

on:
  push:
    branches:
      - x4pro-port
    paths:
      - .github/workflows/x4pro-bootstrap-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create source-only pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-alpha.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Inx X4 Pro v0.1.0-alpha.0 — Bootstrap" \
            --prerelease \
            --notes $'⚠️ DO NOT FLASH THIS RELEASE TO AN XTEINK X4 PRO.\n\nThis is a source-only bootstrap release for the X4 Pro port. No firmware binary is attached intentionally.\n\nSafety status:\n- X4 Pro hardware port is not complete yet.\n- Bootloader is not modified.\n- Partition table is not modified.\n- OTA is not enabled for X4 Pro.\n- First hardware test will use only the inactive OTA application slot after validating the device partition layout and creating a full flash backup.\n\nDevelopment branch: x4pro-port\n\nBase: Inx 1.0.19.'
