name: CrossPlay stable promotion prep

on:
  push:
    branches:
      - feature/battleship-browser-crossplay
    paths:
      - .github/workflows/crossplay-alpha5-once.yml

permissions:
  contents: write

jobs:
  prepare-stable-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/battleship-browser-crossplay
          fetch-depth: 0

      - name: Prepare v1.14.0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platformio.ini')
          s = p.read_text()
          old = 'version = 1.14.0-alpha.8'
          if old not in s:
              raise SystemExit('expected alpha.8 version not found')
          p.write_text(s.replace(old, 'version = 1.14.0', 1))
          PY
          grep -Fq '### What is new in 1.14.0' .github/workflows/crossplay-release.yml

      - name: Commit prepared stable version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platformio.ini
          git commit -m "chore: prepare v1.14.0"
          git push origin HEAD:feature/battleship-browser-crossplay
