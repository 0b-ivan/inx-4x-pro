name: CrossPlay alpha5 one-shot

on:
  push:
    branches:
      - feature/battleship-browser-crossplay
    paths:
      - .github/workflows/crossplay-alpha5-once.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare-tag-dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.14.0-alpha.5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/battleship-browser-crossplay
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare alpha.5 metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('platformio.ini')
          s = p.read_text()
          old = 'version = 1.14.0-alpha.4'
          if old not in s:
              raise SystemExit('expected alpha.4 version not found')
          p.write_text(s.replace(old, 'version = 1.14.0-alpha.5', 1))

          p = Path('.github/workflows/crossplay-release.yml')
          s = p.read_text()
          s = s.replace('### What is new in 1.14.0-alpha.4', '### What is new in 1.14.0-alpha.5', 1)
          old_bullet = '- This alpha covers browser setup only: X4 fleet setup and shooting are not available yet.'
          new_bullets = '''- After the browser confirms its fleet, the X4 Pro now leaves the network waiting screen and enters its own fleet placement.\n            - The X4 can shuffle, move and rotate its fleet while the browser session stays connected.\n            - Once both fleets are confirmed, the session advances to the playing state. Shooting is the next implementation step.\n            - Fix the X4 placement build by including the shared `Rect` definition in the browser activity header.'''
          if old_bullet not in s:
              raise SystemExit('expected alpha.4 scope bullet not found')
          p.write_text(s.replace(old_bullet, new_bullets, 1))
          PY

      - name: Validate implementation
        run: |
          set -euo pipefail
          bash host-tests/battleship/run.sh
          bash host-tests/ota/run.sh
          bash host-tests/release/run.sh
          python3 -m pip install -q platformio
          python3 -m platformio run -e simulator_x4_pro

      - name: Commit prepared release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platformio.ini .github/workflows/crossplay-release.yml
          git commit -m "chore: prepare v1.14.0-alpha.5"
          git push origin HEAD:feature/battleship-browser-crossplay
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Tag and dispatch standard release
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to move an existing release tag."
            exit 1
          fi
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "$TAG"
          gh workflow run crossplay-release.yml --ref "$TAG"
