name: Authenticator site fixup

on:
  push:
    branches: [feature/totp-authenticator]
    paths:
      - .github/workflows/totp-site-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/totp-authenticator
      - name: Add Authenticator to site shelf
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          needle = '''    <article class="card">\n      <div class="shot-wrap"><img class="shot" src="assets/shots/xkcd.png"'''
          card = '''    <article class="card">\n      <span class="tag">App · offline</span>\n      <h3>Authenticator</h3>\n      <p>Store multiple TOTP accounts on the device and generate six-digit codes offline. The secret never needs a cloud service.</p>\n    </article>\n\n'''
          if needle not in s:
              raise SystemExit('xkcd card anchor not found')
          p.write_text(s.replace(needle, card + needle, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "docs: add authenticator to site shelf"
          git push origin HEAD:feature/totp-authenticator
