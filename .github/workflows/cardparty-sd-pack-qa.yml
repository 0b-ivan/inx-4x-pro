# Isolated importer QA: does not trigger PR #47 CrossPlay nor publish OTA.
name: CardParty isolated SD pack QA

on:
  push:
    branches:
      - feature/cardparty-sd-pack-importer-20261027
    paths:
      - '.github/workflows/cardparty-sd-pack-qa.yml'
      - 'src/apps_local/cardparty/**'
      - 'tools_local/cardparty_l10n/**'
      - 'host-tests/cardparty/**'

permissions:
  contents: read

concurrency:
  group: cardparty-sd-pack-qa-isolated
  cancel-in-progress: false

jobs:
  reader-and-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate cards importer and all offline localization regressions
        run: python3 -m unittest discover -s tools_local/cardparty_l10n -p 'test_*.py' -v
      - name: Compile real CardPartyCore and SD reader with warnings as errors
        run: |
          for name in sd_pack text_wrap; do
            c++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 \
              -Isrc/apps_local/cardparty host-tests/cardparty/test_$name.cpp -o /tmp/cardparty-$name-test
            /tmp/cardparty-$name-test
          done

  firmware:
    name: Compile X4 Pro firmware (no OTA)
    needs: reader-and-compiler
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: Install firmware toolchain
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --system -U 'https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip'
          uv pip install --system -U 'littlefs-python>=0.16.0' 'fatfs-ng>=0.1.14' 'pyyaml>=6.0.2' \
            'rich-click>=1.8.6' 'zopfli>=0.2.2' 'intelhex>=2.3.0' 'rich>=14.0.0' 'urllib3<2' \
            'cryptography>=45.0.3' 'certifi>=2025.8.3' 'ecdsa>=0.19.1' 'bitstring>=4.3.1' \
            'reedsolo>=1.5.3,<1.8' 'esp-idf-size>=2.0.0' 'esp-coredump>=1.14.0'
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: cardparty-sd-pio-x4pro-v1
      - name: Compile new Activity, HalStorage, Game and SD loader
        run: python3 -m platformio run -e x4pro
